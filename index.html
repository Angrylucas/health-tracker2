<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;
    
    const TIMEZONE = 'Europe/Zurich';
    const WORK_LAT = 47.44517433218009, WORK_LON = 8.612249846939735;
    const HOME_LAT = 47.44684441370621, HOME_LON = 8.649969104383272;
    const LOCATION_RADIUS = 250;

    const getZurichDate = () => new Date(new Date().toLocaleString('en-US', { timeZone: TIMEZONE }));
    const formatDate = (d) => new Date(d).toLocaleString('de-CH', { timeZone: TIMEZONE });
    
    const haversineDistance = (lat1, lon1, lat2, lon2) => {
      const R = 6371000;
      const toRad = x => x * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    };
    
    const getLocationName = (lat, lon) => {
      if (haversineDistance(lat, lon, WORK_LAT, WORK_LON) <= LOCATION_RADIUS) return 'Work';
      if (haversineDistance(lat, lon, HOME_LAT, HOME_LON) <= LOCATION_RADIUS) return 'Home';
      return 'On the Road';
    };
    
    const getMoonPhase = (date = new Date()) => {
      const year = date.getFullYear(), month = date.getMonth() + 1, day = date.getDate();
      let y = year, m = month;
      if (m < 3) { y--; m += 12; }
      const c = Math.floor(y / 100);
      const jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + (2 - c + Math.floor(c/4)) - 1524.5;
      const age = ((jd - 2451550.1) / 29.530588853 % 1) * 29.53;
      const phases = [
        { max: 1.85, name: 'New Moon', icon: '🌑' },
        { max: 5.54, name: 'Waxing Crescent', icon: '🌒' },
        { max: 9.23, name: 'First Quarter', icon: '🌓' },
        { max: 12.92, name: 'Waxing Gibbous', icon: '🌔' },
        { max: 16.61, name: 'Full Moon', icon: '🌕' },
        { max: 20.30, name: 'Waning Gibbous', icon: '🌖' },
        { max: 23.99, name: 'Last Quarter', icon: '🌗' },
        { max: 27.68, name: 'Waning Crescent', icon: '🌘' },
        { max: 30, name: 'New Moon', icon: '🌑' }
      ];
      const phase = phases.find(p => age < p.max) || phases[0];
      return { ...phase, illumination: Math.round((1 - Math.abs(age - 14.765) / 14.765) * 100), age: Math.round(age * 10) / 10 };
    };

    const weatherCodes = {
      0: { desc: 'Clear', icon: 'Sun', score: 5 }, 1: { desc: 'Mostly Clear', icon: 'Sun', score: 5 },
      2: { desc: 'Partly Cloudy', icon: 'CloudSun', score: 4 }, 3: { desc: 'Overcast', icon: 'Cloud', score: 3 },
      45: { desc: 'Foggy', icon: 'CloudFog', score: 2 }, 48: { desc: 'Icy Fog', icon: 'CloudFog', score: 1 },
      51: { desc: 'Light Drizzle', icon: 'CloudDrizzle', score: 3 }, 53: { desc: 'Drizzle', icon: 'CloudDrizzle', score: 2 },
      55: { desc: 'Heavy Drizzle', icon: 'CloudDrizzle', score: 2 }, 56: { desc: 'Freezing Drizzle', icon: 'Snowflake', score: 1 },
      61: { desc: 'Light Rain', icon: 'CloudRain', score: 3 }, 63: { desc: 'Rain', icon: 'CloudRain', score: 2 },
      65: { desc: 'Heavy Rain', icon: 'CloudRain', score: 1 }, 66: { desc: 'Freezing Rain', icon: 'Snowflake', score: 1 },
      71: { desc: 'Light Snow', icon: 'Snowflake', score: 3 }, 73: { desc: 'Snow', icon: 'Snowflake', score: 2 },
      75: { desc: 'Heavy Snow', icon: 'Snowflake', score: 1 }, 77: { desc: 'Snow Grains', icon: 'Snowflake', score: 2 },
      80: { desc: 'Light Showers', icon: 'CloudRain', score: 3 }, 81: { desc: 'Showers', icon: 'CloudRain', score: 2 },
      82: { desc: 'Heavy Showers', icon: 'CloudRain', score: 1 }, 85: { desc: 'Snow Showers', icon: 'Snowflake', score: 2 },
      95: { desc: 'Thunderstorm', icon: 'CloudLightning', score: 1 }, 96: { desc: 'Hail Storm', icon: 'CloudLightning', score: 0 },
      99: { desc: 'Severe Storm', icon: 'CloudLightning', score: 0 }
    };
    const getWeather = (code) => weatherCodes[code] || { desc: 'Unknown', icon: 'Cloud', score: 3 };

    const Icon = ({ name, size = 24, className = "" }) => {
      const ref = React.useRef(null);
      useEffect(() => {
        if (ref.current && lucide.icons[name]) {
          ref.current.innerHTML = '';
          const icon = lucide.createElement(lucide.icons[name]);
          icon.setAttribute('width', size);
          icon.setAttribute('height', size);
          if (className) icon.setAttribute('class', className);
          ref.current.appendChild(icon);
        }
      }, [name, size, className]);
      return <span ref={ref} className="inline-flex items-center justify-center" />;
    };

    const App = () => {
      const [tab, setTab] = useState('dashboard');
      const [entries, setEntries] = useState([]);
      const [modal, setModal] = useState(null);
      const [metric, setMetric] = useState(null);
      const [range, setRange] = useState('30d');
      const [loading, setLoading] = useState(true);
      const [weather, setWeather] = useState(null);
      const [locationName, setLocationName] = useState('...');
      const [moon, setMoon] = useState(getMoonPhase());
      const [settings, setSettings] = useState(false);
      const [trakt, setTrakt] = useState({ clientId: '', token: '' });
      const [corr1, setCorr1] = useState('');
      const [corr2, setCorr2] = useState('');
      const [customCorr, setCustomCorr] = useState(null);

      const types = {
        sauna: { icon: 'Thermometer', color: 'bg-orange-500', label: 'Sauna', cat: 'wellness', unit: 'min', field: 'duration', fields: ['duration', 'temperature'] },
        coldPlunge: { icon: 'Droplet', color: 'bg-blue-500', label: 'Cold Plunge', cat: 'wellness', unit: 'min', field: 'duration', fields: ['duration', 'temperature'] },
        workout: { icon: 'Dumbbell', color: 'bg-green-500', label: 'Workout', cat: 'fitness', unit: 'min', field: 'duration' },
        steps: { icon: 'Footprints', color: 'bg-teal-500', label: 'Steps', cat: 'fitness', unit: 'steps', field: 'value' },
        activeCalories: { icon: 'Flame', color: 'bg-orange-600', label: 'Active Cal', cat: 'fitness', unit: 'kcal', field: 'value' },
        exerciseMinutes: { icon: 'Zap', color: 'bg-lime-500', label: 'Exercise', cat: 'fitness', unit: 'min', field: 'value' },
        distance: { icon: 'MapPin', color: 'bg-emerald-600', label: 'Distance', cat: 'fitness', unit: 'km', field: 'value' },
        sleep: { icon: 'Moon', color: 'bg-indigo-500', label: 'Sleep', cat: 'vitals', unit: 'hrs', field: 'value' },
        heartRate: { icon: 'Heart', color: 'bg-red-500', label: 'Heart Rate', cat: 'vitals', unit: 'bpm', field: 'value' },
        restingHR: { icon: 'Heart', color: 'bg-pink-500', label: 'Resting HR', cat: 'vitals', unit: 'bpm', field: 'value' },
        hrv: { icon: 'Activity', color: 'bg-purple-600', label: 'HRV', cat: 'vitals', unit: 'ms', field: 'value' },
        weight: { icon: 'Scale', color: 'bg-slate-600', label: 'Weight', cat: 'vitals', unit: 'kg', field: 'value' },
        water: { icon: 'Droplet', color: 'bg-cyan-500', label: 'Water', cat: 'nutrition', unit: 'ml', field: 'quantity' },
        coffee: { icon: 'Coffee', color: 'bg-amber-700', label: 'Coffee', cat: 'nutrition', unit: 'cups', field: 'quantity' },
        alcohol: { icon: 'Wine', color: 'bg-purple-500', label: 'Alcohol', cat: 'nutrition', unit: 'drinks', field: 'quantity' },
        mood: { icon: 'Smile', color: 'bg-yellow-500', label: 'Mood', cat: 'mental', unit: '', field: 'mood' },
        energy: { icon: 'Battery', color: 'bg-amber-500', label: 'Energy', cat: 'mental', unit: '', field: 'energy' },
        mindfulness: { icon: 'Brain', color: 'bg-violet-500', label: 'Mindfulness', cat: 'mental', unit: 'min', field: 'value' },
        workHours: { icon: 'Briefcase', color: 'bg-gray-700', label: 'Work Hours', cat: 'productivity', unit: 'hrs', field: 'duration' },
        meetings: { icon: 'Users', color: 'bg-blue-700', label: 'Meetings', cat: 'productivity', unit: '', field: 'count' },
        masturbation: { icon: 'Heart', color: 'bg-pink-400', label: 'Masturbation', cat: 'lifestyle', unit: '', field: 'value', simple: true },
        sexualActivity: { icon: 'Heart', color: 'bg-red-400', label: 'Sexual Activity', cat: 'lifestyle', unit: '', field: 'value', simple: true },
        vacation: { icon: 'Palmtree', color: 'bg-green-400', label: 'Vacation', cat: 'lifestyle', unit: '', field: 'value', simple: true },
        weather: { icon: 'Sun', color: 'bg-yellow-400', label: 'Weather', cat: 'auto', unit: '°C', field: 'temperature', auto: true },
        sunshine: { icon: 'Sun', color: 'bg-amber-400', label: 'Sunshine', cat: 'auto', unit: 'hrs', field: 'value', auto: true },
        moonPhase: { icon: 'Moon', color: 'bg-gray-500', label: 'Moon Phase', cat: 'auto', unit: '%', field: 'illumination', auto: true },
        location: { icon: 'MapPin', color: 'bg-blue-600', label: 'Location', cat: 'auto', unit: '', field: 'name', auto: true },
        billsGame: { icon: 'Trophy', color: 'bg-blue-800', label: 'Bills Game', cat: 'auto', unit: '', field: 'won', auto: true },
        tvWatched: { icon: 'Tv', color: 'bg-purple-700', label: 'TV (Trakt)', cat: 'entertainment', unit: 'ep', field: 'value', auto: true },
        movieWatched: { icon: 'Film', color: 'bg-indigo-700', label: 'Movie (Trakt)', cat: 'entertainment', unit: '', field: 'value', auto: true },
      };

      const moodNum = m => ({ great: 5, good: 4, neutral: 3, low: 2, bad: 1 }[m] || 3);
      const energyNum = e => ({ 'very-high': 5, high: 4, medium: 3, low: 2, 'very-low': 1 }[e] || 3);
      const numMood = n => n >= 4.5 ? '😄' : n >= 3.5 ? '🙂' : n >= 2.5 ? '😐' : n >= 1.5 ? '😕' : '😢';
      const numEnergy = n => n >= 4.5 ? '⚡' : n >= 3.5 ? '🔋' : n >= 2.5 ? '➡️' : n >= 1.5 ? '🔻' : '💤';

      useEffect(() => {
        const saved = localStorage.getItem('ht-entries');
        if (saved) setEntries(JSON.parse(saved));
        const savedTrakt = localStorage.getItem('ht-trakt');
        if (savedTrakt) setTrakt(JSON.parse(savedTrakt));
        setLoading(false);
        initAutoTracking();
      }, []);

      useEffect(() => {
        if (!loading) localStorage.setItem('ht-entries', JSON.stringify(entries));
      }, [entries, loading]);

      const todayKey = () => getZurichDate().toDateString();
      const hasToday = (type) => entries.some(e => e.type === type && new Date(e.ts).toDateString() === todayKey());

      const initAutoTracking = async () => {
        setMoon(getMoonPhase());
        
        if (!hasToday('moonPhase')) {
          const m = getMoonPhase();
          addEntry({ type: 'moonPhase', illumination: m.illumination, phase: m.name, auto: true });
        }

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(async pos => {
            const { latitude: lat, longitude: lon } = pos.coords;
            const locName = getLocationName(lat, lon);
            setLocationName(locName);
            
            if (!hasToday('location')) {
              addEntry({ type: 'location', name: locName, lat, lon, auto: true });
            }

            try {
              const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=sunshine_duration&timezone=Europe/Zurich`);
              const data = await res.json();
              setWeather(data);
              
              if (!hasToday('weather') && data.current) {
                addEntry({ type: 'weather', temperature: data.current.temperature_2m, humidity: data.current.relative_humidity_2m, code: data.current.weather_code, wind: data.current.wind_speed_10m, auto: true });
              }
              if (!hasToday('sunshine') && data.daily?.sunshine_duration?.[0]) {
                addEntry({ type: 'sunshine', value: Math.round(data.daily.sunshine_duration[0] / 360) / 10, auto: true });
              }
            } catch (e) { console.error('Weather error:', e); }
          }, () => setLocationName('Unknown'));
        }

        fetchBillsGame();
      };

      const fetchBillsGame = async () => {
        try {
          const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/buf/schedule');
          const data = await res.json();
          const completed = data.events?.filter(e => e.competitions?.[0]?.status?.type?.completed) || [];
          if (completed.length > 0) {
            const last = completed[completed.length - 1];
            const comp = last.competitions[0];
            const bills = comp.competitors.find(c => c.team.abbreviation === 'BUF');
            const opp = comp.competitors.find(c => c.team.abbreviation !== 'BUF');
            if (bills && opp) {
              const won = parseInt(bills.score) > parseInt(opp.score);
              const gameDate = new Date(last.date).toDateString();
              const hasGame = entries.some(e => e.type === 'billsGame' && new Date(e.ts).toDateString() === gameDate);
              if (!hasGame) {
                addEntry({ type: 'billsGame', won: won ? 1 : 0, score: `${bills.score}-${opp.score}`, opponent: opp.team.displayName, auto: true, ts: new Date(last.date).toISOString() });
              }
            }
          }
        } catch (e) { console.error('Bills error:', e); }
      };

      const addEntry = (data) => {
        const entry = { id: Date.now() + Math.random(), ts: data.ts || new Date().toISOString(), ...data };
        setEntries(prev => [entry, ...prev]);
      };
      const delEntry = (id) => setEntries(prev => prev.filter(e => e.id !== id));

      const getFiltered = (type, r = range) => {
        const now = getZurichDate();
        let start = new Date(now);
        if (r === '7d') start.setDate(now.getDate() - 7);
        else if (r === '30d') start.setDate(now.getDate() - 30);
        else if (r === '90d') start.setDate(now.getDate() - 90);
        else start = new Date(0);
        return entries.filter(e => e.type === type && new Date(e.ts) >= start).sort((a, b) => new Date(a.ts) - new Date(b.ts));
      };

      const getDailyData = () => {
        const daily = {};
        entries.forEach(e => {
          const day = new Date(e.ts).toDateString();
          if (!daily[day]) daily[day] = {};
          const t = types[e.type];
          if (!t) return;
          
          let val;
          if (e.type === 'mood') val = moodNum(e.mood);
          else if (e.type === 'energy') val = energyNum(e.energy);
          else if (e.type === 'weather') { daily[day].weatherScore = getWeather(e.code).score; daily[day].temperature = e.temperature; daily[day].wind = e.wind; return; }
          else if (e.type === 'moonPhase') { daily[day].moonIllum = e.illumination; return; }
          else if (e.type === 'location') { daily[day].atWork = e.name === 'Work' ? 1 : 0; daily[day].atHome = e.name === 'Home' ? 1 : 0; return; }
          else if (e.type === 'billsGame') { daily[day].billsWon = e.won; return; }
          else if (t.simple) val = 1;
          else val = parseFloat(e[t.field]) || 0;

          const sum = ['steps', 'activeCalories', 'exerciseMinutes', 'water', 'coffee', 'alcohol', 'mindfulness', 'workHours', 'meetings', 'sauna', 'coldPlunge', 'workout', 'distance', 'masturbation', 'sexualActivity', 'tvWatched', 'movieWatched'].includes(e.type);
          if (sum) daily[day][e.type] = (daily[day][e.type] || 0) + val;
          else {
            if (!daily[day][e.type]) daily[day][e.type] = { s: 0, n: 0 };
            daily[day][e.type].s += val;
            daily[day][e.type].n++;
          }
          if (e.type === 'vacation') daily[day].isVacation = 1;
        });
        
        Object.values(daily).forEach(d => {
          Object.keys(d).forEach(k => {
            if (d[k]?.n) d[k] = d[k].s / d[k].n;
          });
        });
        return daily;
      };

      const calcCorr = (x, y) => {
        if (x.length < 5) return null;
        const n = x.length;
        const sx = x.reduce((a, b) => a + b, 0), sy = y.reduce((a, b) => a + b, 0);
        const sxy = x.reduce((a, xi, i) => a + xi * y[i], 0);
        const sx2 = x.reduce((a, xi) => a + xi * xi, 0), sy2 = y.reduce((a, yi) => a + yi * yi, 0);
        const num = n * sxy - sx * sy;
        const den = Math.sqrt((n * sx2 - sx * sx) * (n * sy2 - sy * sy));
        return den === 0 ? null : num / den;
      };

      const correlations = useMemo(() => {
        const daily = getDailyData();
        const days = Object.keys(daily);
        const pairs = [
          ['alcohol', 'mood'], ['alcohol', 'energy'], ['alcohol', 'sleep'], ['alcohol', 'hrv'],
          ['coffee', 'energy'], ['coffee', 'mood'], ['coffee', 'sleep'],
          ['workHours', 'energy'], ['workHours', 'mood'], ['workHours', 'sleep'],
          ['meetings', 'energy'], ['meetings', 'mood'],
          ['workout', 'mood'], ['workout', 'energy'], ['workout', 'sleep'],
          ['exerciseMinutes', 'mood'], ['exerciseMinutes', 'energy'],
          ['steps', 'mood'], ['steps', 'energy'], ['steps', 'sleep'],
          ['sleep', 'mood'], ['sleep', 'energy'], ['sleep', 'hrv'],
          ['sauna', 'mood'], ['sauna', 'sleep'], ['sauna', 'hrv'],
          ['coldPlunge', 'mood'], ['coldPlunge', 'energy'], ['coldPlunge', 'hrv'],
          ['water', 'energy'], ['water', 'mood'],
          ['mindfulness', 'mood'], ['mindfulness', 'energy'], ['mindfulness', 'sleep'],
          ['weatherScore', 'mood'], ['weatherScore', 'energy'], ['weatherScore', 'steps'],
          ['temperature', 'mood'], ['temperature', 'energy'], ['temperature', 'sleep'],
          ['sunshine', 'mood'], ['sunshine', 'energy'],
          ['moonIllum', 'mood'], ['moonIllum', 'energy'], ['moonIllum', 'sleep'],
          ['masturbation', 'mood'], ['masturbation', 'energy'], ['masturbation', 'sleep'],
          ['sexualActivity', 'mood'], ['sexualActivity', 'energy'], ['sexualActivity', 'sleep'],
          ['isVacation', 'mood'], ['isVacation', 'energy'], ['isVacation', 'sleep'], ['isVacation', 'hrv'],
          ['billsWon', 'mood'], ['billsWon', 'energy'], ['billsWon', 'alcohol'],
          ['atWork', 'mood'], ['atWork', 'energy'], ['atWork', 'steps'],
          ['wind', 'mood'], ['wind', 'energy'],
          ['tvWatched', 'mood'], ['tvWatched', 'sleep'],
        ];
        
        const results = [];
        pairs.forEach(([cause, effect]) => {
          const xs = [], ys = [];
          days.forEach(d => {
            if (daily[d][cause] !== undefined && daily[d][effect] !== undefined) {
              xs.push(daily[d][cause]);
              ys.push(daily[d][effect]);
            }
          });
          if (xs.length >= 5) {
            const c = calcCorr(xs, ys);
            if (c !== null && Math.abs(c) >= 0.15) {
              results.push({
                cause, effect, corr: Math.round(c * 100) / 100, n: xs.length,
                strength: Math.abs(c) >= 0.7 ? 'strong' : Math.abs(c) >= 0.4 ? 'moderate' : 'weak',
                dir: c > 0 ? 'positive' : 'negative'
              });
            }
          }
        });
        return results.sort((a, b) => Math.abs(b.corr) - Math.abs(a.corr));
      }, [entries]);

      const findCustomCorr = () => {
        if (!corr1 || !corr2) return;
        const daily = getDailyData();
        const xs = [], ys = [];
        Object.keys(daily).forEach(d => {
          if (daily[d][corr1] !== undefined && daily[d][corr2] !== undefined) {
            xs.push(daily[d][corr1]);
            ys.push(daily[d][corr2]);
          }
        });
        if (xs.length >= 5) {
          const c = calcCorr(xs, ys);
          setCustomCorr({ corr: c, n: xs.length, m1: corr1, m2: corr2 });
        } else {
          setCustomCorr({ error: `Need 5+ days, found ${xs.length}`, m1: corr1, m2: corr2 });
        }
      };

      const allMetrics = ['mood', 'energy', 'sleep', 'hrv', 'restingHR', 'heartRate', 'steps', 'exerciseMinutes', 'workout', 'activeCalories', 'water', 'coffee', 'alcohol', 'workHours', 'meetings', 'mindfulness', 'sauna', 'coldPlunge', 'masturbation', 'sexualActivity', 'isVacation', 'weatherScore', 'temperature', 'sunshine', 'moonIllum', 'wind', 'atWork', 'atHome', 'billsWon', 'tvWatched', 'movieWatched', 'weight', 'distance'];

      const calcStress = () => {
        const today = todayKey();
        const todayEntries = entries.filter(e => new Date(e.ts).toDateString() === today);
        let stress = 50;
        const factors = [];
        
        const hrv = todayEntries.filter(e => e.type === 'hrv');
        if (hrv.length) {
          const avg = hrv.reduce((s, e) => s + (parseFloat(e.value) || 0), 0) / hrv.length;
          if (avg < 20) { stress += 25; factors.push('Very low HRV'); }
          else if (avg < 35) { stress += 15; factors.push('Low HRV'); }
          else if (avg >= 55) { stress -= 15; factors.push('Excellent HRV'); }
        }
        
        const rhr = todayEntries.filter(e => e.type === 'restingHR');
        if (rhr.length) {
          const avg = rhr.reduce((s, e) => s + (parseFloat(e.value) || 0), 0) / rhr.length;
          if (avg > 75) { stress += 15; factors.push('High resting HR'); }
          else if (avg < 55) { stress -= 10; factors.push('Low resting HR'); }
        }
        
        const work = todayEntries.filter(e => e.type === 'workHours').reduce((s, e) => s + (parseFloat(e.duration) || 0), 0);
        if (work > 10) { stress += 20; factors.push('Very long work day'); }
        else if (work > 8) { stress += 10; factors.push('Long work day'); }
        
        const mtg = todayEntries.filter(e => e.type === 'meetings').reduce((s, e) => s + (parseFloat(e.count) || 0), 0);
        if (mtg > 5) { stress += 15; factors.push('Many meetings'); }
        else if (mtg > 3) { stress += 8; factors.push('Several meetings'); }
        
        const slp = todayEntries.find(e => e.type === 'sleep');
        if (slp) {
          const hrs = parseFloat(slp.value) || 0;
          if (hrs < 5) { stress += 20; factors.push('Very poor sleep'); }
          else if (hrs < 6) { stress += 12; factors.push('Poor sleep'); }
          else if (hrs >= 7.5) { stress -= 10; factors.push('Good sleep'); }
        }
        
        const coffee = todayEntries.filter(e => e.type === 'coffee').reduce((s, e) => s + (parseFloat(e.quantity) || 0), 0);
        if (coffee > 4) { stress += 8; factors.push('High caffeine'); }
        
        const exercise = todayEntries.filter(e => e.type === 'exerciseMinutes').reduce((s, e) => s + (parseFloat(e.value) || 0), 0);
        if (exercise >= 30) { stress -= 15; factors.push('Good exercise'); }
        
        const mindful = todayEntries.filter(e => e.type === 'mindfulness').reduce((s, e) => s + (parseFloat(e.value) || 0), 0);
        if (mindful >= 10) { stress -= 12; factors.push('Mindfulness'); }
        
        if (todayEntries.some(e => e.type === 'vacation')) { stress -= 20; factors.push('Vacation day'); }
        
        return { score: Math.max(0, Math.min(100, Math.round(stress))), factors };
      };

      const calcWellness = () => {
        const today = todayKey();
        const todayEntries = entries.filter(e => new Date(e.ts).toDateString() === today);
        let score = 50;
        const bd = [];
        
        // Get dynamic impacts from correlations
        const weatherCorr = correlations.find(c => c.cause === 'weatherScore' && c.effect === 'mood');
        const sunCorr = correlations.find(c => c.cause === 'sunshine' && c.effect === 'mood');
        const moonCorr = correlations.find(c => c.cause === 'moonIllum' && c.effect === 'mood');
        
        if (todayEntries.some(e => e.type === 'workout')) { score += 12; bd.push({ f: 'Workout', i: 12, p: true }); }
        if (todayEntries.some(e => e.type === 'sauna')) { score += 8; bd.push({ f: 'Sauna', i: 8, p: true }); }
        if (todayEntries.some(e => e.type === 'coldPlunge')) { score += 8; bd.push({ f: 'Cold Plunge', i: 8, p: true }); }
        
        const steps = todayEntries.filter(e => e.type === 'steps').reduce((s, e) => s + (parseFloat(e.value) || 0), 0);
        if (steps >= 10000) { score += 10; bd.push({ f: '10k Steps', i: 10, p: true }); }
        else if (steps >= 5000) { score += 5; bd.push({ f: '5k Steps', i: 5, p: true }); }
        
        const slp = todayEntries.find(e => e.type === 'sleep');
        if (slp) {
          const hrs = parseFloat(slp.value) || 0;
          if (hrs >= 7 && hrs <= 9) { score += 15; bd.push({ f: 'Good Sleep', i: 15, p: true }); }
          else if (hrs < 6) { score -= 10; bd.push({ f: 'Poor Sleep', i: -10, p: false }); }
        }
        
        const water = todayEntries.filter(e => e.type === 'water').reduce((s, e) => s + (parseFloat(e.quantity) || 0), 0);
        if (water >= 2000) { score += 8; bd.push({ f: 'Hydrated', i: 8, p: true }); }
        
        const alc = todayEntries.filter(e => e.type === 'alcohol').reduce((s, e) => s + (parseFloat(e.quantity) || 0), 0);
        if (alc > 0) { const pen = Math.min(alc * 6, 15); score -= pen; bd.push({ f: 'Alcohol', i: -pen, p: false }); }
        
        if (todayEntries.some(e => e.type === 'vacation')) { score += 10; bd.push({ f: 'Vacation', i: 10, p: true }); }
        
        // Dynamic weather impact based on correlations
        const wx = todayEntries.find(e => e.type === 'weather');
        if (wx && weatherCorr) {
          const wxScore = getWeather(wx.code).score;
          const impact = Math.round((wxScore - 3) * weatherCorr.corr * 3);
          if (impact !== 0) { score += impact; bd.push({ f: 'Weather', i: impact, p: impact > 0 }); }
        }
        
        // Dynamic sunshine impact
        const sun = todayEntries.find(e => e.type === 'sunshine');
        if (sun && sunCorr) {
          const hrs = parseFloat(sun.value) || 0;
          const impact = Math.round((hrs - 4) * sunCorr.corr * 2);
          if (impact !== 0) { score += impact; bd.push({ f: 'Sunshine', i: impact, p: impact > 0 }); }
        }
        
        // Dynamic moon impact
        const moonE = todayEntries.find(e => e.type === 'moonPhase');
        if (moonE && moonCorr) {
          const impact = Math.round((moonE.illumination - 50) / 50 * moonCorr.corr * 3);
          if (Math.abs(impact) >= 1) { score += impact; bd.push({ f: 'Moon', i: impact, p: impact > 0 }); }
        }
        
        // Bills impact
        const bills = todayEntries.find(e => e.type === 'billsGame');
        if (bills) {
          if (bills.won) { score += 8; bd.push({ f: 'Bills Won! 🏈', i: 8, p: true }); }
          else { score -= 5; bd.push({ f: 'Bills Lost', i: -5, p: false }); }
        }
        
        return { score: Math.max(0, Math.min(100, Math.round(score))), breakdown: bd };
      };

      const stress = calcStress();
      const wellness = calcWellness();

      const todayStats = useMemo(() => {
        const today = todayKey();
        const te = entries.filter(e => new Date(e.ts).toDateString() === today);
        return {
          steps: te.filter(e => e.type === 'steps').reduce((s, e) => s + (parseFloat(e.value) || 0), 0),
          cal: te.filter(e => e.type === 'activeCalories').reduce((s, e) => s + (parseFloat(e.value) || 0), 0),
          exercise: te.filter(e => e.type === 'exerciseMinutes').reduce((s, e) => s + (parseFloat(e.value) || 0), 0),
          water: te.filter(e => e.type === 'water').reduce((s, e) => s + (parseFloat(e.quantity) || 0), 0),
        };
      }, [entries]);

      const manualCats = { wellness: ['sauna', 'coldPlunge'], fitness: ['workout', 'steps', 'activeCalories', 'exerciseMinutes', 'distance'], vitals: ['sleep', 'heartRate', 'restingHR', 'hrv', 'weight'], nutrition: ['water', 'coffee', 'alcohol'], mental: ['mood', 'energy', 'mindfulness'], productivity: ['workHours', 'meetings'], lifestyle: ['masturbation', 'sexualActivity', 'vacation'] };
      const allCats = { ...manualCats, environment: ['weather', 'sunshine', 'moonPhase', 'location'], sports: ['billsGame'], entertainment: ['tvWatched', 'movieWatched'] };

      const stressColor = s => s >= 70 ? 'text-red-500' : s >= 50 ? 'text-orange-500' : s >= 30 ? 'text-yellow-500' : 'text-green-500';
      const stressLabel = s => s >= 70 ? 'High' : s >= 50 ? 'Moderate' : s >= 30 ? 'Low' : 'Calm';

      const Chart = ({ type }) => {
        const info = types[type];
        const data = getFiltered(type);
        if (!data.length) return <div className="h-48 flex items-center justify-center text-gray-400">No data</div>;
        
        const hasMulti = info.fields?.length > 1;
        const grouped = {};
        data.forEach(e => {
          const d = new Date(e.ts).toLocaleDateString('de-CH');
          if (!grouped[d]) grouped[d] = hasMulti ? info.fields.map(() => []) : [];
          if (hasMulti) info.fields.forEach((f, i) => grouped[d][i].push(parseFloat(e[f]) || 0));
          else {
            let v = e.type === 'mood' ? moodNum(e.mood) : e.type === 'energy' ? energyNum(e.energy) : parseFloat(e[info.field]) || (info.simple ? 1 : 0);
            grouped[d].push(v);
          }
        });
        
        const chartData = Object.entries(grouped).map(([date, vals]) => {
          if (hasMulti) return { date, values: vals.map(arr => arr.length ? arr.reduce((a,b) => a+b, 0) / arr.length : 0) };
          const sum = ['steps', 'activeCalories', 'exerciseMinutes', 'water', 'coffee', 'alcohol', 'mindfulness', 'workHours', 'meetings', 'sauna', 'coldPlunge', 'workout', 'distance', 'masturbation', 'sexualActivity', 'tvWatched'].includes(type);
          return { date, value: sum ? vals.reduce((a,b) => a+b, 0) : vals.reduce((a,b) => a+b, 0) / vals.length };
        });
        
        const allVals = hasMulti ? chartData.flatMap(d => d.values) : chartData.map(d => d.value);
        const max = Math.max(...allVals), min = Math.min(...allVals);
        const rng = max - min || 1;
        const colors = ['#3b82f6', '#f97316'];
        
        return (
          <div>
            {hasMulti && <div className="flex gap-4 mb-2 text-xs">{info.fields.map((f, i) => <span key={f} className="flex items-center gap-1"><span className="w-2 h-2 rounded" style={{background: colors[i]}}></span>{f}</span>)}</div>}
            <svg viewBox="0 0 100 50" className="w-full h-48">
              {[0, .5, 1].map((r, i) => <line key={i} x1="10" y1={5 + r * 40} x2="95" y2={5 + r * 40} stroke="#e5e7eb" strokeWidth=".2" />)}
              {hasMulti ? info.fields.map((f, fi) => {
                const pts = chartData.map((d, i) => ({ x: 10 + (i / (chartData.length - 1 || 1)) * 85, y: 45 - ((d.values[fi] - min) / rng) * 40 }));
                return <g key={f}><path d={`M ${pts.map(p => `${p.x} ${p.y}`).join(' L ')}`} fill="none" stroke={colors[fi]} strokeWidth=".8" />{pts.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r=".8" fill={colors[fi]} />)}</g>;
              }) : (
                <g>
                  <path d={`M ${chartData.map((d, i) => `${10 + (i / (chartData.length - 1 || 1)) * 85} ${45 - ((d.value - min) / rng) * 40}`).join(' L ')}`} fill="none" stroke="#3b82f6" strokeWidth=".8" />
                  {chartData.map((d, i) => <circle key={i} cx={10 + (i / (chartData.length - 1 || 1)) * 85} cy={45 - ((d.value - min) / rng) * 40} r=".8" fill="#3b82f6" />)}
                </g>
              )}
            </svg>
          </div>
        );
      };

      const Modal = ({ type, onClose }) => {
        const info = types[type];
        const [form, setForm] = useState({ date: new Date().toISOString().slice(0, 16), duration: '', temperature: '', value: '', quantity: '', mood: 'neutral', energy: 'medium', count: '', notes: '' });
        const save = () => {
          const entry = { type, ...form };
          if (info.simple) entry.value = 1;
          addEntry(entry);
          onClose();
        };
        return (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
            <div className="bg-white rounded-xl w-full max-w-sm p-5">
              <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-lg">{info.label}</h3><button onClick={onClose}><Icon name="X" size={20} /></button></div>
              <div className="space-y-3">
                <input type="datetime-local" value={form.date} onChange={e => setForm({...form, date: e.target.value})} className="w-full border rounded p-2 text-sm" />
                {info.fields?.includes('duration') && <input type="number" placeholder="Duration (min)" value={form.duration} onChange={e => setForm({...form, duration: e.target.value})} className="w-full border rounded p-2 text-sm" />}
                {info.fields?.includes('temperature') && <input type="number" placeholder="Temperature (°C)" value={form.temperature} onChange={e => setForm({...form, temperature: e.target.value})} className="w-full border rounded p-2 text-sm" />}
                {type === 'mood' && <select value={form.mood} onChange={e => setForm({...form, mood: e.target.value})} className="w-full border rounded p-2 text-sm"><option value="great">😄 Great</option><option value="good">🙂 Good</option><option value="neutral">😐 Neutral</option><option value="low">😕 Low</option><option value="bad">😢 Bad</option></select>}
                {type === 'energy' && <select value={form.energy} onChange={e => setForm({...form, energy: e.target.value})} className="w-full border rounded p-2 text-sm"><option value="very-high">⚡ Very High</option><option value="high">🔋 High</option><option value="medium">➡️ Medium</option><option value="low">🔻 Low</option><option value="very-low">💤 Very Low</option></select>}
                {info.field === 'value' && !info.simple && <input type="number" placeholder={info.unit || 'Value'} value={form.value} onChange={e => setForm({...form, value: e.target.value})} className="w-full border rounded p-2 text-sm" />}
                {info.field === 'quantity' && <input type="number" placeholder={info.unit} value={form.quantity} onChange={e => setForm({...form, quantity: e.target.value})} className="w-full border rounded p-2 text-sm" />}
                {info.field === 'duration' && !info.fields && <input type="number" placeholder="Hours" value={form.duration} onChange={e => setForm({...form, duration: e.target.value})} className="w-full border rounded p-2 text-sm" />}
                {info.field === 'count' && <input type="number" placeholder="Count" value={form.count} onChange={e => setForm({...form, count: e.target.value})} className="w-full border rounded p-2 text-sm" />}
                {info.simple && <p className="text-center text-gray-500 text-sm py-2">Tap Save to log</p>}
                <button onClick={save} className="w-full bg-blue-600 text-white rounded p-2 font-medium">Save</button>
              </div>
            </div>
          </div>
        );
      };

      const Detail = ({ type, onBack }) => {
        const info = types[type];
        const data = getFiltered(type);
        return (
          <div className="space-y-4">
            <div className="flex items-center gap-3">
              <button onClick={onBack} className="p-1"><Icon name="ChevronLeft" size={24} /></button>
              <div className={`${info.color} p-2 rounded-lg text-white`}><Icon name={info.icon} size={20} /></div>
              <h2 className="text-xl font-bold">{info.label}</h2>
            </div>
            <div className="flex gap-2">{['7d', '30d', '90d', 'all'].map(r => <button key={r} onClick={() => setRange(r)} className={`px-3 py-1 rounded text-sm ${range === r ? 'bg-blue-600 text-white' : 'bg-gray-100'}`}>{r}</button>)}</div>
            <div className="bg-white p-4 rounded-xl shadow"><Chart type={type} /></div>
            <div className="bg-white p-4 rounded-xl shadow">
              <h3 className="font-bold mb-3">Recent ({data.length})</h3>
              <div className="space-y-2 max-h-64 overflow-auto">
                {data.slice().reverse().slice(0, 20).map(e => (
                  <div key={e.id} className="flex justify-between items-center p-2 bg-gray-50 rounded text-sm">
                    <div>
                      <div className="font-medium">{type === 'mood' ? numMood(moodNum(e.mood)) : type === 'energy' ? numEnergy(energyNum(e.energy)) : type === 'weather' ? `${e.temperature}°C ${getWeather(e.code).desc}` : type === 'moonPhase' ? `${e.phase} ${e.illumination}%` : type === 'billsGame' ? `${e.won ? 'Won' : 'Lost'} ${e.score}` : info.simple ? '✓' : info.fields ? info.fields.map(f => e[f]).join('/') : `${e[info.field]} ${info.unit}`}</div>
                      <div className="text-xs text-gray-500">{formatDate(e.ts)}</div>
                    </div>
                    {!e.auto && <button onClick={() => delEntry(e.id)} className="text-red-400"><Icon name="X" size={16} /></button>}
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      };

      if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="animate-spin h-8 w-8 border-2 border-blue-600 border-t-transparent rounded-full"></div></div>;

      return (
        <div className="min-h-screen bg-gray-50">
          <div className="bg-white border-b sticky top-0 z-40 px-4 py-2">
            <div className="max-w-2xl mx-auto flex justify-between items-center">
              <div><h1 className="font-bold text-lg">Health Tracker</h1><p className="text-xs text-gray-500">{locationName} • {getZurichDate().toLocaleDateString('de-CH')}</p></div>
              <button onClick={() => setSettings(true)}><Icon name="Settings" size={20} /></button>
            </div>
          </div>
          
          <div className="bg-white border-b sticky top-12 z-30">
            <div className="max-w-2xl mx-auto flex">
              {['dashboard', 'trends', 'insights'].map(t => <button key={t} onClick={() => { setTab(t); setMetric(null); }} className={`flex-1 py-2 text-sm font-medium border-b-2 ${tab === t ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500'}`}>{t.charAt(0).toUpperCase() + t.slice(1)}</button>)}
            </div>
          </div>

          <div className="max-w-2xl mx-auto p-4">
            {tab === 'dashboard' && (
              <div className="space-y-4">
                {/* Weather + Moon */}
                <div className="bg-gradient-to-r from-sky-500 to-blue-600 rounded-xl p-4 text-white">
                  <div className="flex justify-between items-center">
                    <div className="flex items-center gap-3">
                      {weather?.current && <Icon name={getWeather(weather.current.weather_code).icon} size={36} />}
                      <div>
                        <div className="text-3xl font-bold">{weather?.current ? Math.round(weather.current.temperature_2m) : '--'}°C</div>
                        <div className="text-sm opacity-90">{weather?.current ? getWeather(weather.current.weather_code).desc : 'Loading...'}</div>
                      </div>
                      <div className="text-xs opacity-75 ml-4">
                        {weather?.daily && <div>☀️ {Math.round((weather.daily.sunshine_duration?.[0] || 0) / 3600)}h</div>}
                        {weather?.current && <div>💨 {Math.round(weather.current.wind_speed_10m)}km/h</div>}
                      </div>
                    </div>
                    <div className="text-center">
                      <div className="text-3xl">{moon.icon}</div>
                      <div className="text-xs opacity-80">{moon.name}</div>
                      <div className="text-xs opacity-60">{moon.illumination}%</div>
                    </div>
                  </div>
                </div>

                {/* Wellness + Stress */}
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-gradient-to-br from-purple-500 to-indigo-600 rounded-xl p-4 text-white">
                    <div className="text-xs opacity-80 mb-1">Wellness</div>
                    <div className="text-3xl font-bold">{wellness.score}</div>
                    <div className="text-xs mt-2 space-y-0.5 max-h-16 overflow-auto">
                      {wellness.breakdown.slice(0, 4).map((b, i) => <div key={i} className="flex justify-between"><span>{b.f}</span><span className={b.p ? 'text-green-300' : 'text-red-300'}>{b.i > 0 ? '+' : ''}{b.i}</span></div>)}
                    </div>
                  </div>
                  <div className="bg-white rounded-xl p-4 shadow">
                    <div className="text-xs text-gray-500 mb-1">Stress Level</div>
                    <div className={`text-3xl font-bold ${stressColor(stress.score)}`}>{stress.score}</div>
                    <div className={`text-sm ${stressColor(stress.score)}`}>{stressLabel(stress.score)}</div>
                    <div className="text-xs text-gray-400 mt-1 space-y-0.5">
                      {stress.factors.slice(0, 2).map((f, i) => <div key={i}>• {f}</div>)}
                    </div>
                  </div>
                </div>

                {/* Quick Stats */}
                <div className="grid grid-cols-4 gap-2">
                  {[{ i: 'Footprints', v: todayStats.steps.toLocaleString(), l: 'Steps', c: 'text-teal-600' }, { i: 'Flame', v: todayStats.cal, l: 'Cal', c: 'text-orange-600' }, { i: 'Zap', v: todayStats.exercise, l: 'Min', c: 'text-lime-600' }, { i: 'Droplet', v: `${todayStats.water}`, l: 'ml', c: 'text-cyan-600' }].map((s, i) => (
                    <div key={i} className="bg-white p-2 rounded-lg shadow text-center">
                      <Icon name={s.i} size={16} className={s.c} />
                      <div className="font-bold text-sm">{s.v}</div>
                      <div className="text-xs text-gray-400">{s.l}</div>
                    </div>
                  ))}
                </div>

                {/* Manual Categories */}
                {Object.entries(manualCats).map(([cat, items]) => (
                  <div key={cat} className="bg-white p-3 rounded-xl shadow">
                    <h3 className="text-xs font-bold text-gray-500 uppercase mb-2">{cat}</h3>
                    <div className="grid grid-cols-5 gap-2">
                      {items.map(k => { const t = types[k]; return (
                        <button key={k} onClick={() => setModal(k)} className="flex flex-col items-center p-2 rounded-lg hover:bg-gray-50">
                          <div className={`${t.color} p-1.5 rounded-full text-white`}><Icon name={t.icon} size={14} /></div>
                          <span className="text-xs mt-1 text-center leading-tight">{t.label}</span>
                        </button>
                      ); })}
                    </div>
                  </div>
                ))}

                {/* Recent */}
                <div className="bg-white p-3 rounded-xl shadow">
                  <h3 className="text-xs font-bold text-gray-500 uppercase mb-2">Recent</h3>
                  <div className="space-y-1">
                    {entries.slice(0, 6).map(e => { const t = types[e.type]; if (!t) return null; return (
                      <div key={e.id} className="flex items-center gap-2 p-2 bg-gray-50 rounded text-sm">
                        <div className={`${t.color} p-1 rounded text-white`}><Icon name={t.icon} size={12} /></div>
                        <span className="flex-1 truncate">{t.label}</span>
                        <span className="text-xs text-gray-400">{new Date(e.ts).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' })}</span>
                      </div>
                    ); })}
                  </div>
                </div>
              </div>
            )}

            {tab === 'trends' && (metric ? <Detail type={metric} onBack={() => setMetric(null)} /> : (
              <div className="space-y-4">
                {Object.entries(allCats).map(([cat, items]) => (
                  <div key={cat} className="bg-white p-3 rounded-xl shadow">
                    <h3 className="text-xs font-bold text-gray-500 uppercase mb-2">{cat}</h3>
                    <div className="grid grid-cols-2 gap-2">
                      {items.map(k => { const t = types[k]; const n = entries.filter(e => e.type === k).length; return (
                        <button key={k} onClick={() => setMetric(k)} className={`flex items-center gap-2 p-2 rounded-lg text-left ${n ? 'hover:bg-gray-50' : 'opacity-40'}`}>
                          <div className={`${t.color} p-2 rounded text-white`}><Icon name={t.icon} size={14} /></div>
                          <div><div className="font-medium text-sm">{t.label}</div><div className="text-xs text-gray-400">{n} entries</div></div>
                        </button>
                      ); })}
                    </div>
                  </div>
                ))}
              </div>
            ))}

            {tab === 'insights' && (
              <div className="space-y-4">
                {/* Custom Correlation */}
                <div className="bg-white p-4 rounded-xl shadow">
                  <h3 className="font-bold mb-3 flex items-center gap-2"><Icon name="Search" size={16} />Find Correlation</h3>
                  <div className="grid grid-cols-3 gap-2">
                    <select value={corr1} onChange={e => setCorr1(e.target.value)} className="border rounded p-2 text-sm">
                      <option value="">Metric 1</option>
                      {allMetrics.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                    <select value={corr2} onChange={e => setCorr2(e.target.value)} className="border rounded p-2 text-sm">
                      <option value="">Metric 2</option>
                      {allMetrics.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                    <button onClick={findCustomCorr} className="bg-blue-600 text-white rounded text-sm">Analyze</button>
                  </div>
                  {customCorr && (
                    <div className={`mt-3 p-3 rounded ${customCorr.error ? 'bg-red-50 text-red-600' : customCorr.corr > 0 ? 'bg-green-50' : 'bg-red-50'}`}>
                      {customCorr.error ? <p className="text-sm">{customCorr.error}</p> : (
                        <div><p className="font-medium text-sm">{customCorr.m1} ↔ {customCorr.m2}</p><p className={`text-xl font-bold ${customCorr.corr > 0 ? 'text-green-600' : 'text-red-600'}`}>{customCorr.corr > 0 ? '+' : ''}{(customCorr.corr * 100).toFixed(0)}%</p><p className="text-xs text-gray-500">{customCorr.n} days</p></div>
                      )}
                    </div>
                  )}
                </div>

                {/* Auto Correlations */}
                <div className="bg-white p-4 rounded-xl shadow">
                  <h3 className="font-bold mb-3 flex items-center gap-2"><Icon name="Lightbulb" size={16} className="text-yellow-500" />Discovered</h3>
                  {correlations.length === 0 ? <p className="text-gray-400 text-center py-8 text-sm">Track 5+ days to see correlations</p> : (
                    <div className="space-y-2">
                      {correlations.slice(0, 15).map((c, i) => (
                        <div key={i} className={`p-2 rounded text-sm ${c.strength === 'strong' ? 'bg-yellow-50' : c.strength === 'moderate' ? 'bg-blue-50' : 'bg-gray-50'}`}>
                          <div className="flex justify-between">
                            <span>{c.cause} → {c.effect}</span>
                            <span className={c.dir === 'positive' ? 'text-green-600' : 'text-red-600'}>{c.corr > 0 ? '+' : ''}{(c.corr * 100).toFixed(0)}%</span>
                          </div>
                          <div className="text-xs text-gray-400">{c.n} days • {c.strength}</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>

          {modal && <Modal type={modal} onClose={() => setModal(null)} />}
          {settings && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl w-full max-w-sm p-5">
                <div className="flex justify-between mb-4"><h3 className="font-bold">Settings</h3><button onClick={() => setSettings(false)}><Icon name="X" size={20} /></button></div>
                <div className="space-y-3">
                  <div><label className="text-sm font-medium">Trakt.tv Client ID</label><input type="text" value={trakt.clientId} onChange={e => setTrakt({...trakt, clientId: e.target.value})} className="w-full border rounded p-2 text-sm mt-1" /></div>
                  <div><label className="text-sm font-medium">Trakt.tv Token</label><input type="password" value={trakt.token} onChange={e => setTrakt({...trakt, token: e.target.value})} className="w-full border rounded p-2 text-sm mt-1" /></div>
                  <button onClick={() => { localStorage.setItem('ht-trakt', JSON.stringify(trakt)); setSettings(false); }} className="w-full bg-blue-600 text-white rounded p-2">Save</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
