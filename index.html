<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider { position: absolute; inset: 0; background: #ccc; border-radius: 24px; transition: .3s; cursor: pointer; }
    .toggle .slider:before { content: ''; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; }
    .toggle input:checked + .slider { background: #3b82f6; }
    .toggle input:checked + .slider:before { transform: translateX(20px); }
    .dark .toggle .slider { background: #4b5563; }
    .dark .toggle input:checked + .slider { background: #3b82f6; }

</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;
    const TIMEZONE = 'Europe/Zurich';
    const WORK_LAT = 47.44517433218009, WORK_LON = 8.612249846939735;
    const HOME_LAT = 47.44684441370621, HOME_LON = 8.649969104383272;
    const COLD_START_DAYS = 14;

    const getZurichDate = () => new Date(new Date().toLocaleString('en-US', { timeZone: TIMEZONE }));
    const formatDate = (d) => new Date(d).toLocaleString('de-CH', { timeZone: TIMEZONE });
    const isWeekday = () => { const d = getZurichDate().getDay(); return d >= 1 && d <= 5; };
    const todayKey = () => getZurichDate().toDateString();
    
    const haversine = (lat1, lon1, lat2, lon2) => {
      const R = 6371000, toRad = x => x * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    };
    const getLocName = (lat, lon) => haversine(lat, lon, WORK_LAT, WORK_LON) <= 250 ? 'Work' : haversine(lat, lon, HOME_LAT, HOME_LON) <= 250 ? 'Home' : 'On the Road';
    
    const getMoon = (date = new Date()) => {
      let y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
      if (m < 3) { y--; m += 12; }
      const c = Math.floor(y / 100);
      const jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + (2 - c + Math.floor(c/4)) - 1524.5;
      const age = ((jd - 2451550.1) / 29.530588853 % 1) * 29.53;
      const phases = [{m:1.85,n:'New',i:'🌑'},{m:5.54,n:'Wax Cres',i:'🌒'},{m:9.23,n:'1st Qtr',i:'🌓'},{m:12.92,n:'Wax Gib',i:'🌔'},{m:16.61,n:'Full',i:'🌕'},{m:20.30,n:'Wan Gib',i:'🌖'},{m:23.99,n:'3rd Qtr',i:'🌗'},{m:27.68,n:'Wan Cres',i:'🌘'},{m:30,n:'New',i:'🌑'}];
      const p = phases.find(p => age < p.m) || phases[0];
      return { name: p.n, icon: p.i, illum: Math.round((1 - Math.abs(age - 14.765) / 14.765) * 100), cyclic: (Math.cos((age / 29.53) * 2 * Math.PI) + 1) / 2 };
    };

    const wxCodes = {0:{d:'Clear',i:'Sun',s:1},1:{d:'Clear',i:'Sun',s:.9},2:{d:'Cloudy',i:'CloudSun',s:.7},3:{d:'Overcast',i:'Cloud',s:.5},45:{d:'Fog',i:'CloudFog',s:.4},51:{d:'Drizzle',i:'CloudDrizzle',s:.5},61:{d:'Rain',i:'CloudRain',s:.4},63:{d:'Rain',i:'CloudRain',s:.3},65:{d:'Heavy Rain',i:'CloudRain',s:.2},71:{d:'Snow',i:'Snowflake',s:.5},73:{d:'Snow',i:'Snowflake',s:.4},80:{d:'Showers',i:'CloudRain',s:.4},95:{d:'Storm',i:'CloudLightning',s:.1}};
    const getWx = c => wxCodes[c] || {d:'?',i:'Cloud',s:.5};
    const aqiColor = a => a <= 25 ? 'text-green-500' : a <= 50 ? 'text-yellow-500' : a <= 75 ? 'text-orange-500' : 'text-red-500';
    const pollenColor = l => l <= 1 ? 'text-green-500' : l <= 2 ? 'text-yellow-500' : l <= 3 ? 'text-orange-500' : 'text-red-500';

    const Icon = ({ name, size = 24, className = "" }) => {
      const ref = React.useRef(null);
      useEffect(() => { if (ref.current && lucide.icons[name]) { ref.current.innerHTML = ''; const i = lucide.createElement(lucide.icons[name]); i.setAttribute('width', size); i.setAttribute('height', size); if (className) i.setAttribute('class', className); ref.current.appendChild(i); }}, [name, size, className]);
      return <span ref={ref} className="inline-flex items-center justify-center" />;
    };

    const Toggle = ({ checked, onChange, label }) => (
      <div className="flex items-center justify-between py-2">
        <span className="text-sm dark:text-gray-200">{label}</span>
        <label className="toggle"><input type="checkbox" checked={checked} onChange={e => onChange(e.target.checked)} /><span className="slider"></span></label>
      </div>
    );

    const BASE_W = { sleep: .20, mood: .15, energy: .15, steps: .10, activeCalories: .08, workout: .08, mindfulness: .06, water: .05, hrv: .08, coldPlunge: .03, sauna: .02, alcohol: -.15, screenTime: -.05, sickness: -.20 };

    const App = () => {
      const [dark, setDark] = useState(() => localStorage.getItem('ht-dark') === 'true');
      const [tab, setTab] = useState('dashboard');
      const [entries, setEntries] = useState([]);
      const [modal, setModal] = useState(null);
      const [detail, setDetail] = useState(null);
      const [scoreView, setScoreView] = useState(null);
      const [scoreRange, setScoreRange] = useState('today');
      const [range, setRange] = useState('30d');
      const [loading, setLoading] = useState(true);
      const [weather, setWeather] = useState(null);
      const [aqi, setAqi] = useState(null);
      const [pollen, setPollen] = useState(null);
      const [locName, setLocName] = useState('...');
      const [moon, setMoon] = useState(getMoon());
      const [settings, setSettings] = useState(false);
      const [trakt, setTrakt] = useState({ clientId: '', token: '' });
      const [corr1, setCorr1] = useState('');
      const [corr2, setCorr2] = useState('');
      const [customCorr, setCustomCorr] = useState(null);
      const [toggles, setToggles] = useState({ work: isWeekday(), vacation: false, workTravel: false, sickness: false, masturbation: true, sexualActivity: false });

      useEffect(() => {
        if (dark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem('ht-dark', dark);
      }, [dark]);

      const types = {
        sauna:{icon:'Flame',color:'bg-orange-500',label:'Sauna',cat:'wellness',unit:'min',field:'duration',fields:['duration','temperature']},
        coldPlunge:{icon:'Snowflake',color:'bg-cyan-500',label:'Cold Plunge',cat:'wellness',unit:'min',field:'duration',fields:['duration','temperature']},
        workout:{icon:'Dumbbell',color:'bg-green-500',label:'Workout',cat:'fitness',unit:'min',field:'duration'},
        steps:{icon:'Footprints',color:'bg-teal-500',label:'Steps',cat:'fitness',field:'value'},
        activeCalories:{icon:'Flame',color:'bg-orange-600',label:'Calories',cat:'fitness',unit:'kcal',field:'value'},
        exerciseMinutes:{icon:'Zap',color:'bg-lime-500',label:'Exercise',cat:'fitness',unit:'min',field:'value'},
        distance:{icon:'Map',color:'bg-emerald-600',label:'Distance',cat:'fitness',unit:'km',field:'value'},
        sleep:{icon:'Moon',color:'bg-indigo-500',label:'Sleep',cat:'vitals',unit:'hrs',field:'value'},
        heartRate:{icon:'Heart',color:'bg-red-500',label:'HR',cat:'vitals',unit:'bpm',field:'value'},
        restingHR:{icon:'Heart',color:'bg-pink-500',label:'RHR',cat:'vitals',unit:'bpm',field:'value'},
        hrv:{icon:'Activity',color:'bg-purple-600',label:'HRV',cat:'vitals',unit:'ms',field:'value'},
        weight:{icon:'Scale',color:'bg-slate-600',label:'Weight',cat:'vitals',unit:'kg',field:'value'},
        screenTime:{icon:'Smartphone',color:'bg-gray-600',label:'Screen',cat:'vitals',unit:'hrs',field:'value'},
        water:{icon:'Droplet',color:'bg-blue-500',label:'Water',cat:'nutrition',unit:'ml',field:'quantity'},
        coffee:{icon:'Coffee',color:'bg-amber-700',label:'Coffee',cat:'nutrition',unit:'cups',field:'quantity'},
        alcohol:{icon:'Wine',color:'bg-purple-500',label:'Alcohol',cat:'nutrition',unit:'drinks',field:'quantity'},
        mood:{icon:'Smile',color:'bg-yellow-500',label:'Mood',cat:'mental',field:'mood'},
        energy:{icon:'Battery',color:'bg-amber-500',label:'Energy',cat:'mental',field:'energy'},
        mindfulness:{icon:'Brain',color:'bg-violet-500',label:'Mindful',cat:'mental',unit:'min',field:'value'},
        work:{icon:'Briefcase',color:'bg-gray-700',label:'Work',cat:'daily',toggle:true},
        vacation:{icon:'Palmtree',color:'bg-green-400',label:'Vacation',cat:'daily',toggle:true},
        workTravel:{icon:'Plane',color:'bg-blue-600',label:'Travel',cat:'daily',toggle:true},
        sickness:{icon:'Thermometer',color:'bg-red-400',label:'Sick',cat:'daily',toggle:true},
        masturbation:{icon:'Heart',color:'bg-pink-400',label:'Masturbation',cat:'lifestyle',toggle:true},
        sexualActivity:{icon:'Heart',color:'bg-red-400',label:'Sex',cat:'lifestyle',toggle:true},
        weather:{icon:'Sun',color:'bg-yellow-400',label:'Weather',cat:'env',auto:true},
        sunshine:{icon:'Sun',color:'bg-amber-400',label:'Sun',cat:'env',unit:'hrs',auto:true},
        wind:{icon:'Wind',color:'bg-sky-400',label:'Wind',cat:'env',unit:'km/h',auto:true},
        moonPhase:{icon:'Moon',color:'bg-gray-500',label:'Moon',cat:'env',auto:true},
        airQuality:{icon:'Wind',color:'bg-sky-500',label:'AQI',cat:'env',auto:true},
        pollenCount:{icon:'Flower2',color:'bg-yellow-500',label:'Pollen',cat:'env',auto:true},
        billsGame:{icon:'Trophy',color:'bg-blue-800',label:'Bills',cat:'sports',auto:true},
      };

      const moodNum = m => ({great:1,good:.75,neutral:.5,low:.25,bad:0}[m] ?? .5);
      const energyNum = e => ({'very-high':1,high:.75,medium:.5,low:.25,'very-low':0}[e] ?? .5);
      const moodEmoji = n => n >= .8 ? '😄' : n >= .6 ? '🙂' : n >= .4 ? '😐' : n >= .2 ? '😕' : '😢';
      const energyEmoji = n => n >= .8 ? '⚡' : n >= .6 ? '🔋' : n >= .4 ? '➡️' : n >= .2 ? '🔻' : '💤';
      const norm = (v, min, max) => Math.max(0, Math.min(1, (v - min) / (max - min)));

      useEffect(() => {
        const s = localStorage.getItem('ht-v3'); if (s) setEntries(JSON.parse(s));
        const st = localStorage.getItem('ht-trakt'); if (st) setTrakt(JSON.parse(st));
        const tog = localStorage.getItem('ht-tog-' + todayKey()); if (tog) setToggles(JSON.parse(tog));
        setLoading(false); initAuto();
      }, []);

      useEffect(() => { if (!loading) localStorage.setItem('ht-v3', JSON.stringify(entries)); }, [entries, loading]);
      useEffect(() => { localStorage.setItem('ht-tog-' + todayKey(), JSON.stringify(toggles)); }, [toggles]);

      const hasToday = t => entries.some(e => e.type === t && new Date(e.ts).toDateString() === todayKey());
      const getTodayEntries = () => entries.filter(e => new Date(e.ts).toDateString() === todayKey());
      const getDayCount = () => new Set(entries.map(e => new Date(e.ts).toDateString())).size;

      const initAuto = async () => {
        setMoon(getMoon());
        if (!hasToday('moonPhase')) { const m = getMoon(); addEntry({type:'moonPhase',illum:m.illum,name:m.name,cyclic:m.cyclic,auto:true}); }
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(async pos => {
            const {latitude:lat,longitude:lon} = pos.coords;
            const ln = getLocName(lat, lon); setLocName(ln);
            if (!hasToday('location')) addEntry({type:'location',name:ln,lat,lon,auto:true});
            try {
              const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=sunshine_duration&timezone=Europe/Zurich`);
              const d = await r.json(); setWeather(d);
              if (!hasToday('weather') && d.current) { addEntry({type:'weather',temp:d.current.temperature_2m,code:d.current.weather_code,auto:true}); addEntry({type:'wind',value:d.current.wind_speed_10m,auto:true}); }
              if (!hasToday('sunshine') && d.daily?.sunshine_duration?.[0]) addEntry({type:'sunshine',value:Math.round(d.daily.sunshine_duration[0]/360)/10,auto:true});
            } catch(e){}
            try {
              const ar = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi,pm10,pm2_5&timezone=Europe/Zurich`);
              const ad = await ar.json(); setAqi(ad.current);
              if (!hasToday('airQuality') && ad.current) addEntry({type:'airQuality',aqi:ad.current.european_aqi,auto:true});
            } catch(e){}
            try {
              const pr = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=grass_pollen,birch_pollen,alder_pollen&timezone=Europe/Zurich`);
              const pd = await pr.json();
              if (pd.current) { const mx = Math.max(pd.current.grass_pollen||0,pd.current.birch_pollen||0,pd.current.alder_pollen||0); const lv = mx>100?4:mx>50?3:mx>20?2:mx>0?1:0; setPollen({level:lv,max:mx}); if (!hasToday('pollenCount')) addEntry({type:'pollenCount',level:lv,auto:true}); }
            } catch(e){}
          }, () => setLocName('Unknown'));
        }
        try {
          const br = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/buf/schedule');
          const bd = await br.json();
          const comp = bd.events?.filter(e => e.competitions?.[0]?.status?.type?.completed) || [];
          if (comp.length) { const last = comp[comp.length-1], c = last.competitions[0], bills = c.competitors.find(x => x.team.abbreviation === 'BUF'), opp = c.competitors.find(x => x.team.abbreviation !== 'BUF');
            if (bills && opp) { const won = parseInt(bills.score) > parseInt(opp.score), gd = new Date(last.date).toDateString();
              if (!entries.some(e => e.type === 'billsGame' && new Date(e.ts).toDateString() === gd)) addEntry({type:'billsGame',won:won?1:0,score:`${bills.score}-${opp.score}`,opp:opp.team.displayName,auto:true,ts:new Date(last.date).toISOString()}); }}
        } catch(e){}
      };

      const addEntry = d => setEntries(prev => [{id:Date.now()+Math.random(),ts:d.ts||new Date().toISOString(),...d},...prev]);
      const delEntry = id => setEntries(prev => prev.filter(e => e.id !== id));
      const saveToggle = (t, v) => { setEntries(prev => prev.filter(e => !(e.type === t && new Date(e.ts).toDateString() === todayKey()))); addEntry({type:t,value:v?1:0}); };
      const handleToggle = (t, v) => { const nt = {...toggles,[t]:v}; if (t === 'vacation' && v) nt.work = false; setToggles(nt); saveToggle(t,v); if (t === 'vacation' && v) saveToggle('work',false); };

      const getDailyData = useCallback(() => {
        const daily = {};
        entries.forEach(e => {
          const day = new Date(e.ts).toDateString();
          if (!daily[day]) daily[day] = {raw:{},norm:{}};
          const d = daily[day];
          switch(e.type) {
            case 'mood': d.raw.mood = moodNum(e.mood); d.norm.mood = d.raw.mood; break;
            case 'energy': d.raw.energy = energyNum(e.energy); d.norm.energy = d.raw.energy; break;
            case 'sleep': d.raw.sleep = parseFloat(e.value)||0; d.norm.sleep = norm(d.raw.sleep,4,9); break;
            case 'hrv': d.raw.hrv = parseFloat(e.value)||0; d.norm.hrv = norm(d.raw.hrv,20,80); break;
            case 'restingHR': d.raw.rhr = parseFloat(e.value)||0; d.norm.rhr = 1-norm(d.raw.rhr,50,90); break;
            case 'steps': d.raw.steps = (d.raw.steps||0)+(parseFloat(e.value)||0); d.norm.steps = norm(d.raw.steps,0,12000); break;
            case 'activeCalories': d.raw.cal = (d.raw.cal||0)+(parseFloat(e.value)||0); d.norm.cal = norm(d.raw.cal,0,600); break;
            case 'workout': d.raw.workout = (d.raw.workout||0)+(parseFloat(e.duration)||0); d.norm.workout = norm(d.raw.workout,0,90); break;
            case 'exerciseMinutes': d.raw.exercise = (d.raw.exercise||0)+(parseFloat(e.value)||0); d.norm.exercise = norm(d.raw.exercise,0,60); break;
            case 'water': d.raw.water = (d.raw.water||0)+(parseFloat(e.quantity)||0); d.norm.water = norm(d.raw.water,0,3000); break;
            case 'coffee': d.raw.coffee = (d.raw.coffee||0)+(parseFloat(e.quantity)||0); d.norm.coffee = norm(d.raw.coffee,0,5); break;
            case 'alcohol': d.raw.alcohol = (d.raw.alcohol||0)+(parseFloat(e.quantity)||0); d.norm.alcohol = norm(d.raw.alcohol,0,5); break;
            case 'mindfulness': d.raw.mindful = (d.raw.mindful||0)+(parseFloat(e.value)||0); d.norm.mindful = norm(d.raw.mindful,0,30); break;
            case 'screenTime': d.raw.screen = parseFloat(e.value)||0; d.norm.screen = norm(d.raw.screen,0,8); break;
            case 'sauna': d.raw.sauna = (d.raw.sauna||0)+(parseFloat(e.duration)||0); d.norm.sauna = norm(d.raw.sauna,0,30); break;
            case 'coldPlunge': d.raw.cold = (d.raw.cold||0)+(parseFloat(e.duration)||0); d.norm.cold = norm(d.raw.cold,0,10); break;
            case 'weather': d.raw.wxScore = getWx(e.code).s; d.norm.wx = d.raw.wxScore; d.raw.temp = e.temp; break;
            case 'wind': d.raw.wind = parseFloat(e.value)||0; d.norm.wind = 1-norm(d.raw.wind,0,50); break;
            case 'sunshine': d.raw.sun = parseFloat(e.value)||0; d.norm.sun = norm(d.raw.sun,0,14); break;
            case 'moonPhase': d.raw.moonCyc = e.cyclic; d.norm.moon = e.cyclic; d.raw.moonIllum = e.illum; break;
            case 'airQuality': d.raw.aqi = e.aqi; d.norm.aqi = 1-norm(e.aqi,0,100); break;
            case 'pollenCount': d.raw.pollen = e.level; d.norm.pollen = 1-norm(e.level,0,4); break;
            case 'work': d.raw.work = e.value; break;
            case 'vacation': d.raw.vacation = e.value; break;
            case 'workTravel': d.raw.travel = e.value; break;
            case 'sickness': d.raw.sick = e.value; break;
          }
        });
        return daily;
      }, [entries]);

      const calcCorr = useCallback(() => {
        const daily = getDailyData(), days = Object.keys(daily);
        if (days.length < COLD_START_DAYS) return {};
        const pearson = (x, y) => { if (x.length < 5) return 0; const n = x.length, sx = x.reduce((a,b)=>a+b,0), sy = y.reduce((a,b)=>a+b,0), sxy = x.reduce((a,xi,i)=>a+xi*y[i],0), sx2 = x.reduce((a,xi)=>a+xi*xi,0), sy2 = y.reduce((a,yi)=>a+yi*yi,0); const den = Math.sqrt((n*sx2-sx*sx)*(n*sy2-sy*sy)); return den === 0 ? 0 : (n*sxy-sx*sy)/den; };
        const corrs = {}, metrics = ['mood','energy','sleep','hrv','steps','workout','alcohol','coffee','mindful','wx','pollen','aqi','moon','screen','water'];
        ['mood','energy'].forEach(out => { metrics.forEach(inp => { if (inp === out) return; const xs = [], ys = []; days.forEach(d => { if (daily[d].norm[inp] !== undefined && daily[d].norm[out] !== undefined) { xs.push(daily[d].norm[inp]); ys.push(daily[d].norm[out]); }}); corrs[`${inp}_${out}`] = pearson(xs, ys); }); });
        return corrs;
      }, [getDailyData]);

      const getWeights = useCallback(() => {
        if (getDayCount() < COLD_START_DAYS) return {...BASE_W, personalized: false};
        const corrs = calcCorr(), w = {...BASE_W, personalized: true};
        Object.entries(corrs).forEach(([k, c]) => { const [inp] = k.split('_'); if (Math.abs(c) > .3 && w[inp] !== undefined) w[inp] = BASE_W[inp] * (1 + Math.abs(c)); });
        return w;
      }, [getDayCount, calcCorr]);

      const calcScores = useCallback((data, w) => {
        const {norm:n, raw:r} = data;
        let well = 50, stress = 50;
        const wb = [], sb = [];
        if (n.sleep !== undefined) { const i = (n.sleep-.5)*30; well += i; wb.push({n:'Sleep',i:Math.round(i),r:r.sleep+'h'}); }
        if (n.mood !== undefined) { const i = (n.mood-.5)*25; well += i; wb.push({n:'Mood',i:Math.round(i),r:moodEmoji(n.mood)}); }
        if (n.energy !== undefined) { const i = (n.energy-.5)*25; well += i; wb.push({n:'Energy',i:Math.round(i),r:energyEmoji(n.energy)}); }
        if (n.steps !== undefined) { const i = n.steps*15; well += i; wb.push({n:'Steps',i:Math.round(i),r:r.steps?.toLocaleString()}); }
        if (n.workout !== undefined && n.workout > 0) { const i = n.workout*12; well += i; wb.push({n:'Workout',i:Math.round(i),r:r.workout+'min'}); }
        if (n.cal !== undefined) { const i = n.cal*10; well += i; wb.push({n:'Calories',i:Math.round(i),r:r.cal+'kcal'}); }
        if (n.hrv !== undefined) { const i = (n.hrv-.5)*15; well += i; wb.push({n:'HRV',i:Math.round(i),r:r.hrv+'ms'}); }
        if (n.mindful !== undefined && n.mindful > 0) { const i = n.mindful*10; well += i; wb.push({n:'Mindful',i:Math.round(i),r:r.mindful+'min'}); }
        if (n.water !== undefined) { const i = (n.water-.5)*8; well += i; wb.push({n:'Water',i:Math.round(i),r:r.water+'ml'}); }
        if (n.cold !== undefined && n.cold > 0) { const i = n.cold*8; well += i; wb.push({n:'Cold',i:Math.round(i),r:r.cold+'min'}); }
        if (n.sauna !== undefined && n.sauna > 0) { const i = n.sauna*6; well += i; wb.push({n:'Sauna',i:Math.round(i),r:r.sauna+'min'}); }
        if (r.vacation) { well += 12; wb.push({n:'Vacation',i:12}); }
        if (n.alcohol !== undefined && n.alcohol > 0) { const i = -n.alcohol*20; well += i; wb.push({n:'Alcohol',i:Math.round(i),r:r.alcohol+' drinks'}); }
        if (n.screen !== undefined && n.screen > .5) { const i = -(n.screen-.5)*10; well += i; wb.push({n:'Screen',i:Math.round(i),r:r.screen+'h'}); }
        if (r.sick) { well -= 25; wb.push({n:'Sick',i:-25}); }
        if (n.hrv !== undefined) { const i = -(n.hrv-.5)*25; stress += i; sb.push({n:'HRV',i:Math.round(i)}); }
        if (n.rhr !== undefined) { const i = -(n.rhr-.5)*20; stress += i; sb.push({n:'RHR',i:Math.round(i)}); }
        if (n.sleep !== undefined) { const i = -(n.sleep-.5)*20; stress += i; sb.push({n:'Sleep',i:Math.round(i)}); }
        if (r.work) { stress += 12; sb.push({n:'Work',i:12}); }
        if (r.travel) { stress += 18; sb.push({n:'Travel',i:18}); }
        if (r.sick) { stress += 20; sb.push({n:'Sick',i:20}); }
        if (n.pollen !== undefined && n.pollen < .5) { const i = (.5-n.pollen)*15; stress += i; sb.push({n:'Pollen',i:Math.round(i)}); }
        if (n.aqi !== undefined && n.aqi < .5) { const i = (.5-n.aqi)*12; stress += i; sb.push({n:'AQI',i:Math.round(i)}); }
        if (n.coffee !== undefined && n.coffee > .6) { const i = (n.coffee-.6)*15; stress += i; sb.push({n:'Caffeine',i:Math.round(i)}); }
        if (n.mindful !== undefined && n.mindful > 0) { const i = -n.mindful*18; stress += i; sb.push({n:'Mindful',i:Math.round(i)}); }
        if ((n.exercise||0) > 0 || (n.workout||0) > 0) { const i = -Math.max(n.exercise||0,n.workout||0)*20; stress += i; sb.push({n:'Exercise',i:Math.round(i)}); }
        if (r.vacation) { stress -= 25; sb.push({n:'Vacation',i:-25}); }
        return { well: Math.max(0,Math.min(100,Math.round(well))), stress: Math.max(0,Math.min(100,Math.round(stress))), wb: wb.sort((a,b)=>b.i-a.i), sb: sb.sort((a,b)=>b.i-a.i) };
      }, []);

      const todayScores = useMemo(() => {
        const daily = getDailyData(), w = getWeights();
        if (!daily[todayKey()]) return {well:50,stress:50,wb:[],sb:[],personalized:w.personalized};
        const s = calcScores(daily[todayKey()], w);
        return {...s,personalized:w.personalized};
      }, [getDailyData, getWeights, calcScores]);

      const getHist = useCallback(r => {
        const daily = getDailyData(), w = getWeights(), now = getZurichDate();
        let start = new Date(now);
        if (r === '7d') start.setDate(now.getDate()-7);
        else if (r === '30d') start.setDate(now.getDate()-30);
        else if (r === '90d') start.setDate(now.getDate()-90);
        else start = new Date(0);
        const scores = [], avgImp = {};
        Object.entries(daily).forEach(([day, data]) => {
          if (new Date(day) >= start) {
            const s = calcScores(data, w);
            scores.push({day,...s});
            [...s.wb,...s.sb].forEach(item => { if (!avgImp[item.n]) avgImp[item.n] = {t:0,c:0}; avgImp[item.n].t += item.i; avgImp[item.n].c++; });
          }
        });
        return { scores: scores.sort((a,b)=>new Date(a.day)-new Date(b.day)), avgImp: Object.entries(avgImp).map(([n,d])=>({n,avg:Math.round(d.t/d.c)})).sort((a,b)=>b.avg-a.avg) };
      }, [getDailyData, getWeights, calcScores]);

      const todayData = useMemo(() => {
        const te = getTodayEntries(), d = {};
        te.forEach(e => {
          switch(e.type) {
            case 'steps': d.steps = (d.steps||0)+(parseFloat(e.value)||0); break;
            case 'activeCalories': d.cal = (d.cal||0)+(parseFloat(e.value)||0); break;
            case 'exerciseMinutes': d.exercise = (d.exercise||0)+(parseFloat(e.value)||0); break;
            case 'workout': d.workout = (d.workout||0)+(parseFloat(e.duration)||0); break;
            case 'sleep': d.sleep = parseFloat(e.value)||0; break;
            case 'hrv': d.hrv = parseFloat(e.value)||0; break;
            case 'restingHR': d.rhr = parseFloat(e.value)||0; break;
            case 'screenTime': d.screen = parseFloat(e.value)||0; break;
            case 'water': d.water = (d.water||0)+(parseFloat(e.quantity)||0); break;
            case 'coffee': d.coffee = (d.coffee||0)+(parseFloat(e.quantity)||0); break;
            case 'alcohol': d.alcohol = (d.alcohol||0)+(parseFloat(e.quantity)||0); break;
            case 'mood': d.mood = e.mood; break;
            case 'energy': d.energy = e.energy; break;
            case 'mindfulness': d.mindful = (d.mindful||0)+(parseFloat(e.value)||0); break;
            case 'sauna': d.sauna = (d.sauna||0)+(parseFloat(e.duration)||0); break;
            case 'coldPlunge': d.cold = (d.cold||0)+(parseFloat(e.duration)||0); break;
          }
        });
        return d;
      }, [entries]);

      const getFiltered = (t, r = range) => {
        const now = getZurichDate(); let start = new Date(now);
        if (r === '7d') start.setDate(now.getDate()-7);
        else if (r === '30d') start.setDate(now.getDate()-30);
        else if (r === '90d') start.setDate(now.getDate()-90);
        else start = new Date(0);
        return entries.filter(e => e.type === t && new Date(e.ts) >= start).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
      };

      const WellCard = ({score}) => {
        const bg = score >= 70 ? 'from-green-400 to-emerald-500' : score >= 50 ? 'from-yellow-400 to-amber-500' : score >= 30 ? 'from-orange-400 to-red-400' : 'from-red-500 to-red-700';
        const emoji = score >= 80 ? '🌟' : score >= 60 ? '😊' : score >= 40 ? '😐' : score >= 20 ? '😟' : '😫';
        return (<div className={`bg-gradient-to-br ${bg} rounded-2xl p-4 text-white relative overflow-hidden`}><div className="absolute top-2 right-2 text-3xl opacity-30">{emoji}</div><div className="text-xs opacity-80">Wellness</div><div className="text-4xl font-bold">{score}</div><div className="text-xs opacity-70">{score>=70?'Great!':score>=50?'Good':score>=30?'Fair':'Low'}</div></div>);
      };

      const StressCard = ({score}) => {
        const bg = score <= 30 ? 'from-green-400 to-teal-500' : score <= 50 ? 'from-blue-400 to-cyan-500' : score <= 70 ? 'from-yellow-400 to-orange-400' : 'from-red-400 to-red-600';
        const emoji = score >= 80 ? '😰' : score >= 60 ? '😓' : score >= 40 ? '😌' : score >= 20 ? '😊' : '🧘';
        return (<div className={`bg-gradient-to-br ${bg} rounded-2xl p-4 text-white relative overflow-hidden`}><div className="absolute top-2 right-2 text-3xl opacity-30">{emoji}</div><div className="text-xs opacity-80">Stress</div><div className="text-4xl font-bold">{score}</div><div className="text-xs opacity-70">{score<=30?'Calm':score<=50?'Low':score<=70?'Moderate':'High'}</div></div>);
      };

      const EnvCard = ({icon,value,sub,color,onClick}) => (<button onClick={onClick} className="bg-white dark:bg-gray-800 rounded-xl p-2.5 shadow flex flex-col items-center justify-center hover:shadow-md transition min-h-[70px]"><Icon name={icon} size={22} className={color} /><div className="font-bold text-sm mt-0.5 dark:text-white">{value}</div>{sub && <div className="text-xs text-gray-400 -mt-0.5">{sub}</div>}</button>);
      const DataCard = ({label,value,unit,icon,color,onClick}) => (<button onClick={onClick} className="bg-white dark:bg-gray-800 rounded-xl p-3 shadow text-left hover:shadow-md transition w-full"><div className="flex items-center gap-2 mb-1"><div className={`${color} p-1.5 rounded-lg text-white`}><Icon name={icon} size={14}/></div><span className="text-xs text-gray-500 dark:text-gray-400">{label}</span></div><div className="font-bold text-lg dark:text-white">{value??'--'}<span className="text-xs text-gray-400 ml-1">{unit}</span></div></button>);

      const Chart = ({data, h=120}) => {
        if (!data?.length) return <div className="h-32 flex items-center justify-center text-gray-400">No data</div>;
        const vals = data.map(d=>d.value), max = Math.max(...vals), min = Math.min(...vals), rng = max-min||1;
        return (<svg viewBox="0 0 100 40" className="w-full" style={{height:h}}><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3b82f6" stopOpacity=".3"/><stop offset="100%" stopColor="#3b82f6" stopOpacity="0"/></linearGradient></defs>{[0,.5,1].map((r,i)=><line key={i} x1="5" y1={5+r*30} x2="95" y2={5+r*30} stroke="#e5e7eb" strokeWidth=".3"/>)}<path d={`M 5 ${35-((data[0].value-min)/rng)*30} ${data.map((d,i)=>`L ${5+(i/(data.length-1||1))*90} ${35-((d.value-min)/rng)*30}`).join(' ')} L ${95} 35 L 5 35 Z`} fill="url(#cg)"/><path d={`M ${data.map((d,i)=>`${5+(i/(data.length-1||1))*90} ${35-((d.value-min)/rng)*30}`).join(' L ')}`} fill="none" stroke="#3b82f6" strokeWidth="1"/>{data.map((d,i)=><circle key={i} cx={5+(i/(data.length-1||1))*90} cy={35-((d.value-min)/rng)*30} r="1.5" fill="#3b82f6"/>)}</svg>);
      };

      const ScoreDetail = ({type, onBack}) => {
        const isW = type === 'wellness';
        const hist = getHist(scoreRange === 'today' ? '7d' : scoreRange);
        const chartData = hist.scores.map(s=>({date:s.day,value:isW?s.well:s.stress}));
        return (<div className="space-y-4"><div className="flex items-center gap-3"><button onClick={onBack} className="p-1 dark:text-white"><Icon name="ChevronLeft" size={24}/></button><h2 className="text-xl font-bold dark:text-white">{isW?'Wellness Score':'Stress Level'}</h2></div><div className="flex gap-2">{['today','7d','30d','90d','all'].map(r=>(<button key={r} onClick={()=>setScoreRange(r)} className={`px-3 py-1 rounded text-sm ${scoreRange===r?'bg-blue-600 text-white':'bg-gray-100 dark:bg-gray-700 dark:text-gray-200'}`}>{r}</button>))}</div>{scoreRange==='today'?(<div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow"><h3 className="font-bold mb-3 dark:text-white">Today's Breakdown</h3><div className="space-y-2">{(isW?todayScores.wb:todayScores.sb).map((item,i)=>(<div key={i} className="flex justify-between items-center p-2 rounded bg-gray-50 dark:bg-gray-700"><span className="dark:text-gray-200">{item.n} {item.r && <span className="text-gray-400 text-xs">({item.r})</span>}</span><span className={`font-bold ${item.i>0?(isW?'text-green-600':'text-red-500'):(isW?'text-red-500':'text-green-600')}`}>{item.i>0?'+':''}{item.i}</span></div>))}{(isW?todayScores.wb:todayScores.sb).length===0&&<p className="text-gray-400 text-center py-4">No data yet</p>}</div></div>):(<><div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow"><h3 className="font-bold mb-2 dark:text-white">Trend</h3><Chart data={chartData} h={150}/></div><div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow"><h3 className="font-bold mb-3 dark:text-white">Avg Impacts</h3><div className="space-y-2">{hist.avgImp.slice(0,10).map((item,i)=>(<div key={i} className="flex justify-between items-center p-2 rounded bg-gray-50 dark:bg-gray-700"><span className="dark:text-gray-200">{item.n}</span><span className={`font-bold ${item.avg>0?(isW?'text-green-600':'text-red-500'):(isW?'text-red-500':'text-green-600')}`}>{item.avg>0?'+':''}{item.avg}</span></div>))}</div></div></>)}{!todayScores.personalized&&<div className="bg-blue-50 dark:bg-blue-900/30 p-3 rounded-xl text-sm text-blue-700 dark:text-blue-300"><Icon name="Info" size={16} className="inline mr-1"/>Learning: {getDayCount()}/{COLD_START_DAYS} days</div>}</div>);
      };

      const MetricDetail = ({type, onBack}) => {
        const info = types[type];
        const data = getFiltered(type);
        const grouped = {};
        data.forEach(e => { const d = new Date(e.ts).toLocaleDateString('de-CH'); if (!grouped[d]) grouped[d] = []; let v = type==='mood'?moodNum(e.mood)*100:type==='energy'?energyNum(e.energy)*100:type==='weather'?e.temp:type==='moonPhase'?e.illum:type==='airQuality'?e.aqi:type==='pollenCount'?e.level*25:info.fields?parseFloat(e[info.fields[0]])||0:parseFloat(e[info.field])||parseFloat(e.value)||0; grouped[d].push(v); });
        const chartData = Object.entries(grouped).map(([date,vals])=>{const sum=['steps','activeCalories','exerciseMinutes','water','coffee','alcohol','mindfulness','workout','sauna','coldPlunge','distance','screenTime'].includes(type); return {date,value:sum?vals.reduce((a,b)=>a+b,0):vals.reduce((a,b)=>a+b,0)/vals.length};});
        return (<div className="space-y-4"><div className="flex items-center gap-3"><button onClick={onBack} className="p-1 dark:text-white"><Icon name="ChevronLeft" size={24}/></button><div className={`${info.color} p-2 rounded-lg text-white`}><Icon name={info.icon} size={20}/></div><h2 className="text-xl font-bold dark:text-white">{info.label}</h2></div><div className="flex gap-2">{['7d','30d','90d','all'].map(r=><button key={r} onClick={()=>setRange(r)} className={`px-3 py-1 rounded text-sm ${range===r?'bg-blue-600 text-white':'bg-gray-100 dark:bg-gray-700 dark:text-gray-200'}`}>{r}</button>)}</div><div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow"><Chart data={chartData}/></div><div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow"><h3 className="font-bold mb-3 dark:text-white">Recent</h3><div className="space-y-2 max-h-64 overflow-auto">{data.slice().reverse().slice(0,15).map(e=>(<div key={e.id} className="flex justify-between items-center p-2 bg-gray-50 dark:bg-gray-700 rounded text-sm"><div><span className="font-medium dark:text-white">{type==='mood'?moodEmoji(moodNum(e.mood)):type==='energy'?energyEmoji(energyNum(e.energy)):type==='weather'?`${e.temp}°C ${getWx(e.code).d}`:type==='moonPhase'?e.name:type==='airQuality'?`AQI ${e.aqi}`:type==='pollenCount'?`Lvl ${e.level}`:info.fields?info.fields.map(f=>e[f]).join('/'):e[info.field]||e.value}{info.unit||''}</span><span className="text-gray-400 text-xs ml-2">{formatDate(e.ts)}</span></div>{!e.auto&&<button onClick={()=>delEntry(e.id)} className="text-red-400"><Icon name="X" size={14}/></button>}</div>))}</div></div></div>);
      };

      const Modal = ({type, onClose}) => {
        const info = types[type];
        const [form, setForm] = useState({date:new Date().toISOString().slice(0,16),duration:'',temperature:'',value:'',quantity:'',mood:'neutral',energy:'medium'});
        const save = () => { addEntry({type,...form}); onClose(); };
        return (<div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"><div className="bg-white dark:bg-gray-800 rounded-xl w-full max-w-sm p-5"><div className="flex justify-between items-center mb-4"><h3 className="font-bold text-lg dark:text-white">{info.label}</h3><button onClick={onClose} className="dark:text-white"><Icon name="X" size={20}/></button></div><div className="space-y-3"><input type="datetime-local" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} className="w-full border dark:border-gray-600 rounded p-2 text-sm dark:bg-gray-700 dark:text-white"/>{info.fields?.includes('duration')&&<input type="number" placeholder="Duration (min)" value={form.duration} onChange={e=>setForm({...form,duration:e.target.value})} className="w-full border dark:border-gray-600 rounded p-2 text-sm dark:bg-gray-700 dark:text-white"/>}{info.fields?.includes('temperature')&&<input type="number" placeholder="Temp (°C)" value={form.temperature} onChange={e=>setForm({...form,temperature:e.target.value})} className="w-full border dark:border-gray-600 rounded p-2 text-sm dark:bg-gray-700 dark:text-white"/>}{type==='mood'&&<select value={form.mood} onChange={e=>setForm({...form,mood:e.target.value})} className="w-full border dark:border-gray-600 rounded p-2 text-sm dark:bg-gray-700 dark:text-white"><option value="great">😄 Great</option><option value="good">🙂 Good</option><option value="neutral">😐 Neutral</option><option value="low">😕 Low</option><option value="bad">😢 Bad</option></select>}{type==='energy'&&<select value={form.energy} onChange={e=>setForm({...form,energy:e.target.value})} className="w-full border dark:border-gray-600 rounded p-2 text-sm dark:bg-gray-700 dark:text-white"><option value="very-high">⚡ Very High</option><option value="high">🔋 High</option><option value="medium">➡️ Medium</option><option value="low">🔻 Low</option><option value="very-low">💤 Very Low</option></select>}{info.field==='value'&&!info.toggle&&<input type="number" placeholder={info.unit||'Value'} value={form.value} onChange={e=>setForm({...form,value:e.target.value})} className="w-full border dark:border-gray-600 rounded p-2 text-sm dark:bg-gray-700 dark:text-white"/>}{info.field==='quantity'&&<input type="number" placeholder={info.unit} value={form.quantity} onChange={e=>setForm({...form,quantity:e.target.value})} className="w-full border dark:border-gray-600 rounded p-2 text-sm dark:bg-gray-700 dark:text-white"/>}{info.field==='duration'&&!info.fields&&<input type="number" placeholder="Minutes" value={form.duration} onChange={e=>setForm({...form,duration:e.target.value})} className="w-full border dark:border-gray-600 rounded p-2 text-sm dark:bg-gray-700 dark:text-white"/>}<button onClick={save} className="w-full bg-blue-600 text-white rounded p-2 font-medium">Save</button></div></div></div>);
      };

      if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="animate-spin h-8 w-8 border-2 border-blue-600 border-t-transparent rounded-full"></div></div>;

      return (<div className="min-h-screen bg-gray-100 dark:bg-gray-900 transition-colors"><div className="bg-white dark:bg-gray-800 border-b dark:border-gray-700 sticky top-0 z-40 px-4 py-2"><div className="max-w-lg mx-auto flex justify-between items-center"><div><h1 className="font-bold text-lg dark:text-white">Health Tracker</h1><p className="text-xs text-gray-500 dark:text-gray-400">{locName} • {getZurichDate().toLocaleDateString('de-CH')}</p></div><div className="flex items-center gap-2"><button onClick={()=>setDark(!dark)} className="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><Icon name={dark?'Sun':'Moon'} size={20} className="dark:text-white"/></button><button onClick={()=>setSettings(true)} className="dark:text-white"><Icon name="Settings" size={20}/></button></div></div></div><div className="bg-white dark:bg-gray-800 border-b dark:border-gray-700 sticky top-12 z-30"><div className="max-w-lg mx-auto flex">{['dashboard','track','insights'].map(t=><button key={t} onClick={()=>{setTab(t);setDetail(null);setScoreView(null);}} className={`flex-1 py-2 text-sm font-medium border-b-2 ${tab===t?'border-blue-600 text-blue-600':'border-transparent text-gray-500 dark:text-gray-400'}`}>{t.charAt(0).toUpperCase()+t.slice(1)}</button>)}</div></div><div className="max-w-lg mx-auto p-4">{tab==='dashboard'&&!detail&&!scoreView&&(<div className="space-y-4"><div className="grid grid-cols-6 gap-2"><EnvCard icon={weather?.current?getWx(weather.current.weather_code).i:'Cloud'} value={weather?.current?`${Math.round(weather.current.temperature_2m)}°`:'--'} color={weather?.current?'text-yellow-500':'text-gray-400'} onClick={()=>setDetail('weather')}/><EnvCard icon="Wind" value={weather?.current?Math.round(weather.current.wind_speed_10m):'--'} sub="km/h" color="text-sky-500" onClick={()=>setDetail('wind')}/><EnvCard icon="Sun" value={weather?.daily?Math.round((weather.daily.sunshine_duration?.[0]||0)/3600):'--'} sub="hrs" color="text-amber-500" onClick={()=>setDetail('sunshine')}/><EnvCard icon="Wind" value={aqi?.european_aqi||'--'} sub="AQI" color={aqiColor(aqi?.european_aqi||50)} onClick={()=>setDetail('airQuality')}/><EnvCard icon="Flower2" value={pollen?.level??'--'} sub="/4" color={pollenColor(pollen?.level||0)} onClick={()=>setDetail('pollenCount')}/><button onClick={()=>setDetail('moonPhase')} className="bg-white dark:bg-gray-800 rounded-xl p-2.5 shadow flex flex-col items-center justify-center hover:shadow-md transition min-h-[70px]"><span className="text-2xl">{moon.icon}</span><div className="text-xs text-gray-400">{moon.illum}%</div></button></div><div className="grid grid-cols-2 gap-3"><button onClick={()=>setScoreView('wellness')} className="text-left"><WellCard score={todayScores.well}/></button><button onClick={()=>setScoreView('stress')} className="text-left"><StressCard score={todayScores.stress}/></button></div><div className="bg-white dark:bg-gray-800 p-3 rounded-xl shadow"><h3 className="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-2">Fitness</h3><div className="grid grid-cols-3 gap-2"><DataCard label="Steps" value={todayData.steps?.toLocaleString()} icon="Footprints" color="bg-teal-500" onClick={()=>setDetail('steps')}/><DataCard label="Calories" value={todayData.cal} unit="kcal" icon="Flame" color="bg-orange-500" onClick={()=>setDetail('activeCalories')}/><DataCard label="Exercise" value={todayData.exercise} unit="min" icon="Zap" color="bg-lime-500" onClick={()=>setDetail('exerciseMinutes')}/></div></div><div className="bg-white dark:bg-gray-800 p-3 rounded-xl shadow"><h3 className="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-2">Vitals</h3><div className="grid grid-cols-3 gap-2"><DataCard label="Sleep" value={todayData.sleep} unit="hrs" icon="Moon" color="bg-indigo-500" onClick={()=>setDetail('sleep')}/><DataCard label="HRV" value={todayData.hrv} unit="ms" icon="Activity" color="bg-purple-600" onClick={()=>setDetail('hrv')}/><DataCard label="RHR" value={todayData.rhr} unit="bpm" icon="Heart" color="bg-pink-500" onClick={()=>setDetail('restingHR')}/></div></div><div className="bg-white dark:bg-gray-800 p-3 rounded-xl shadow"><h3 className="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-2">Nutrition</h3><div className="grid grid-cols-3 gap-2"><DataCard label="Water" value={todayData.water} unit="ml" icon="Droplet" color="bg-blue-500" onClick={()=>setDetail('water')}/><DataCard label="Coffee" value={todayData.coffee} unit="cups" icon="Coffee" color="bg-amber-700" onClick={()=>setDetail('coffee')}/><DataCard label="Alcohol" value={todayData.alcohol} unit="" icon="Wine" color="bg-purple-500" onClick={()=>setDetail('alcohol')}/></div></div><div className="bg-white dark:bg-gray-800 p-3 rounded-xl shadow"><h3 className="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-2">Mental</h3><div className="grid grid-cols-3 gap-2"><DataCard label="Mood" value={todayData.mood?moodEmoji(moodNum(todayData.mood)):null} icon="Smile" color="bg-yellow-500" onClick={()=>setDetail('mood')}/><DataCard label="Energy" value={todayData.energy?energyEmoji(energyNum(todayData.energy)):null} icon="Battery" color="bg-amber-500" onClick={()=>setDetail('energy')}/><DataCard label="Mindful" value={todayData.mindful} unit="min" icon="Brain" color="bg-violet-500" onClick={()=>setDetail('mindfulness')}/></div></div><div className="bg-white dark:bg-gray-800 p-3 rounded-xl shadow"><h3 className="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-2">Wellness</h3><div className="grid grid-cols-3 gap-2"><DataCard label="Sauna" value={todayData.sauna} unit="min" icon="Flame" color="bg-orange-500" onClick={()=>setDetail('sauna')}/><DataCard label="Cold" value={todayData.cold} unit="min" icon="Snowflake" color="bg-cyan-500" onClick={()=>setDetail('coldPlunge')}/><DataCard label="Workout" value={todayData.workout} unit="min" icon="Dumbbell" color="bg-green-500" onClick={()=>setDetail('workout')}/></div></div></div>)}{tab==='dashboard'&&detail&&<MetricDetail type={detail} onBack={()=>setDetail(null)}/>}{tab==='dashboard'&&scoreView&&<ScoreDetail type={scoreView} onBack={()=>setScoreView(null)}/>}{tab==='track'&&!modal&&(<div className="space-y-4"><div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow"><h3 className="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-3">Today's Status</h3><div className="grid grid-cols-2 gap-x-4"><Toggle label="Work" checked={toggles.work} onChange={v=>handleToggle('work',v)}/><Toggle label="Vacation" checked={toggles.vacation} onChange={v=>handleToggle('vacation',v)}/><Toggle label="Travel" checked={toggles.workTravel} onChange={v=>handleToggle('workTravel',v)}/><Toggle label="Sick" checked={toggles.sickness} onChange={v=>handleToggle('sickness',v)}/><Toggle label="Masturbation" checked={toggles.masturbation} onChange={v=>handleToggle('masturbation',v)}/><Toggle label="Sex" checked={toggles.sexualActivity} onChange={v=>handleToggle('sexualActivity',v)}/></div></div>{[{c:'Wellness',i:['sauna','coldPlunge']},{c:'Fitness',i:['workout','steps','activeCalories','exerciseMinutes','distance']},{c:'Vitals',i:['sleep','heartRate','restingHR','hrv','weight','screenTime']},{c:'Nutrition',i:['water','coffee','alcohol']},{c:'Mental',i:['mood','energy','mindfulness']}].map(({c,i})=>(<div key={c} className="bg-white dark:bg-gray-800 p-3 rounded-xl shadow"><h3 className="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-2">{c}</h3><div className="grid grid-cols-4 gap-2">{i.map(k=>{const t=types[k];return(<button key={k} onClick={()=>setModal(k)} className="flex flex-col items-center p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700"><div className={`${t.color} p-2 rounded-full text-white`}><Icon name={t.icon} size={16}/></div><span className="text-xs mt-1 dark:text-gray-200">{t.label}</span></button>);})}</div></div>))}</div>)}{tab==='insights'&&(<div className="space-y-4"><div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow"><h3 className="font-bold mb-3 dark:text-white">Find Correlation</h3><div className="grid grid-cols-3 gap-2"><select value={corr1} onChange={e=>setCorr1(e.target.value)} className="border dark:border-gray-600 rounded p-2 text-sm dark:bg-gray-700 dark:text-white"><option value="">Metric 1</option>{['mood','energy','sleep','hrv','steps','workout','alcohol','coffee','wx','pollen','aqi','moon','screen'].map(m=><option key={m} value={m}>{m}</option>)}</select><select value={corr2} onChange={e=>setCorr2(e.target.value)} className="border dark:border-gray-600 rounded p-2 text-sm dark:bg-gray-700 dark:text-white"><option value="">Metric 2</option>{['mood','energy','sleep','hrv','steps','workout','alcohol','coffee','wx','pollen','aqi','moon','screen'].map(m=><option key={m} value={m}>{m}</option>)}</select><button onClick={()=>{const daily=getDailyData(),xs=[],ys=[];Object.values(daily).forEach(d=>{if(d.norm[corr1]!==undefined&&d.norm[corr2]!==undefined){xs.push(d.norm[corr1]);ys.push(d.norm[corr2]);}});if(xs.length>=5){const n=xs.length,sx=xs.reduce((a,b)=>a+b,0),sy=ys.reduce((a,b)=>a+b,0),sxy=xs.reduce((a,xi,i)=>a+xi*ys[i],0),sx2=xs.reduce((a,xi)=>a+xi*xi,0),sy2=ys.reduce((a,yi)=>a+yi*yi,0);const c=(n*sxy-sx*sy)/Math.sqrt((n*sx2-sx*sx)*(n*sy2-sy*sy));setCustomCorr({corr:c,n,m1:corr1,m2:corr2});}else setCustomCorr({error:'Need 5+ days'});}} className="bg-blue-600 text-white rounded text-sm">Analyze</button></div>{customCorr&&(<div className={`mt-3 p-3 rounded ${customCorr.error?'bg-red-50 dark:bg-red-900/30':customCorr.corr>0?'bg-green-50 dark:bg-green-900/30':'bg-red-50 dark:bg-red-900/30'}`}>{customCorr.error?<p className="text-red-600 dark:text-red-400 text-sm">{customCorr.error}</p>:(<div><p className="font-medium dark:text-white">{customCorr.m1} ↔ {customCorr.m2}</p><p className={`text-xl font-bold ${customCorr.corr>0?'text-green-600':'text-red-600'}`}>{(customCorr.corr*100).toFixed(0)}%</p><p className="text-xs text-gray-500 dark:text-gray-400">{customCorr.n} days</p></div>)}</div>)}</div><div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow"><h3 className="font-bold mb-2 dark:text-white">System</h3><div className={`p-3 rounded-lg ${todayScores.personalized?'bg-green-50 dark:bg-green-900/30':'bg-blue-50 dark:bg-blue-900/30'}`}>{todayScores.personalized?<p className="text-green-700 dark:text-green-400 text-sm"><Icon name="Check" size={16} className="inline mr-1"/>Personalized ({getDayCount()} days)</p>:<p className="text-blue-700 dark:text-blue-400 text-sm"><Icon name="Info" size={16} className="inline mr-1"/>Learning: {getDayCount()}/{COLD_START_DAYS} days</p>}</div></div></div>)}</div>{modal&&<Modal type={modal} onClose={()=>setModal(null)}/>}{settings&&(<div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"><div className="bg-white dark:bg-gray-800 rounded-xl w-full max-w-sm p-5"><div className="flex justify-between mb-4"><h3 className="font-bold dark:text-white">Settings</h3><button onClick={()=>setSettings(false)} className="dark:text-white"><Icon name="X" size={20}/></button></div><div className="space-y-3"><div><label className="text-sm font-medium dark:text-gray-200">Trakt Client ID</label><input type="text" value={trakt.clientId} onChange={e=>setTrakt({...trakt,clientId:e.target.value})} className="w-full border dark:border-gray-600 rounded p-2 text-sm mt-1 dark:bg-gray-700 dark:text-white"/></div><div><label className="text-sm font-medium dark:text-gray-200">Trakt Token</label><input type="password" value={trakt.token} onChange={e=>setTrakt({...trakt,token:e.target.value})} className="w-full border dark:border-gray-600 rounded p-2 text-sm mt-1 dark:bg-gray-700 dark:text-white"/></div><button onClick={()=>{localStorage.setItem('ht-trakt',JSON.stringify(trakt));setSettings(false);}} className="w-full bg-blue-600 text-white rounded p-2">Save</button></div></div></div>)}</div>);
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
